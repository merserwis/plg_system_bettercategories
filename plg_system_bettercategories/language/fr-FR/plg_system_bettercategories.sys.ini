PLG_SYSTEM_BETTERCATEGORIES="Système - Better Categories for Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_XML_DESCRIPTION="Better Categories for Gridbox : sur les pages de catégorie de la boutique Gridbox (y compris l'accueil de la boutique), affiche les sous-catégories de la catégorie courante avec le nombre de produits, sous forme de liens texte ou de tuiles avec image. La liste des produits, les filtres et la recherche restent inchangés. Joomla 6 / PHP 8.5."
