PLG_SYSTEM_BETTERCATEGORIES="Système - Better Categories for Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_XML_DESCRIPTION="Better Categories for Gridbox : sur les pages de catégorie de la boutique Gridbox (y compris la page d'accueil de la boutique), affiche les sous-catégories de la catégorie actuelle avec le nombre de produits, sous forme de liens texte ou de vignettes avec image. La liste des produits, les filtres et la recherche ne sont pas modifiés. Joomla 6 / PHP 8.5."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_NO_GRIDBOX="Better Categories for Gridbox : Balbooa Gridbox (com_gridbox) n'est pas installé sur ce site, le plugin n'a donc encore rien à faire."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_OLD_DISABLED="Better Categories for Gridbox : l'ancien plugin Gridbox Subcategories (plg_system_gbsubcats) a été désactivé afin que la liste n'apparaisse pas deux fois. Vous pouvez le désinstaller."
