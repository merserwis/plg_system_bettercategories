PLG_SYSTEM_BETTERCATEGORIES_FILTERS_TEXTS_DESC="Laissez vide pour utiliser les textes de la langue du site (anglais, allemand, polonais, français, tchèque, néerlandais). %d est remplacé par le nombre de produits."
