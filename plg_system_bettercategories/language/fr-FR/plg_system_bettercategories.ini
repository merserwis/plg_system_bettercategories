; 1.2.0 — petites images
PLG_SYSTEM_BETTERCATEGORIES_THUMBS_LABEL="Petites images rapides (WebP)"
PLG_SYSTEM_BETTERCATEGORIES_THUMBS_DESC="Les tuiles chargent des copies WebP réduites des images au lieu des photos en taille réelle : une à la largeur de la tuile et une deux fois plus large pour les écrans haute résolution. Elles sont créées une seule fois et conservées dans media/plg_system_bettercategories/thumbs ; une image modifiée en reçoit de nouvelles. Les images externes, les images pas plus grandes que la tuile et les serveurs sans prise en charge de WebP conservent l'image d'origine."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_LABEL="Largeur des petites images (px)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_DESC="Largeur de la petite copie ; la grande est deux fois plus large. 480 convient pour 3 à 6 tuiles par ligne."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_LABEL="Qualité des petites images (40–95)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_DESC="Qualité WebP. 80 ressemble à l'original pour une fraction de sa taille."

; 1.2.0 — par niveau
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS="Par niveau"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS_DESC="Des paramètres différents selon le niveau de l'arborescence des catégories, par ex. de grandes tuiles avec image sur l'accueil de la boutique et des liens texte compacts plus en profondeur. Chaque champ vide conserve le paramètre principal. Choisissez une catégorie dans l'aperçu en direct pour voir son niveau."
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_LABEL="Paramètres des niveaux"
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_DESC="Une ligne par niveau. Si un niveau a plusieurs lignes, la première s'applique."
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_LABEL="Niveau"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_0="Accueil de la boutique"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_1="Niveau 1 : une catégorie principale"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_2="Niveau 2 : sa sous-catégorie"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_3="Niveau 3 et au-delà"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_INHERIT="— paramètre principal —"

; 1.2.0 — navigation et SEO
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV="Navigation et SEO"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV_DESC="Navigation au dernier niveau de l'arborescence et données structurées pour les moteurs de recherche."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_LABEL="Catégories sœurs au dernier niveau"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_DESC="Une catégorie sans sous-catégories affiche une barre avec les catégories voisines (la catégorie courante mise en évidence) et un lien vers la catégorie parente, pour que les clients changent de catégorie sans revenir en arrière. Les produits en dessous restent inchangés. Sur téléphone, la barre défile latéralement."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_LABEL="Titre de la barre"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_DESC="Vide = pas de titre."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_LABEL="Lien vers la catégorie parente"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_LABEL="Texte du lien de retour"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_DESC="%s est remplacé par le nom de la catégorie parente (ou de la boutique pour les catégories principales)."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_LABEL="Données structurées : liste des catégories"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_DESC="Ajoute les catégories listées sous forme de schema.org ItemList (JSON-LD) pour les moteurs de recherche."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_LABEL="Données structurées : fil d'Ariane"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_DESC="Ajoute un schema.org BreadcrumbList : boutique → catégories parentes → catégorie courante. Automatique ne l'ajoute que si la page n'a pas ses propres données de fil d'Ariane (par exemple d'un module Fil de navigation), pour qu'il n'y en ait jamais deux."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_AUTO="Automatique"

; 1.3.0 — prix « à partir de », première ligne, outils
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_LABEL="Afficher le prix le plus bas"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_DESC="Affiche sous chaque catégorie le prix le plus bas de ses produits (sous-catégories comprises) : le prix soldé s'il existe, y compris les promotions de la boutique et les variantes de produits, dans la devise de la boutique. Les produits sans prix sont ignorés."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_LABEL="Texte du prix"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_DESC="%s est remplacé par le prix avec la devise, par ex. « à partir de %s » ou « à partir de %s HT »."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_COLOR_LABEL="Couleur du prix"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_LABEL="Charger la première ligne immédiatement"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_DESC="Les images de la première ligne de tuiles (autant que de colonnes sur l'appareil du visiteur) se chargent immédiatement en priorité haute ; les autres au défilement. Accélère la partie visible de la page (LCP dans PageSpeed)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_TITLE="Fichier de paramètres"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_DESC="Enregistrez les paramètres de ce formulaire dans un fichier, ou chargez-les depuis un fichier (par ex. d'un autre site). « Styles uniquement » exclut ce qui est propre à ce site : ID des boutiques, ID d'élément et images des catégories."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_ALL="Exporter tous les paramètres"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_STYLES="Exporter uniquement les styles"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT="Importer depuis un fichier…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_STYLES_ONLY="Importer uniquement les styles (conserver les ID des boutiques, l'ID d'élément et les images des catégories de ce site)"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_CONFIRM="Importer les paramètres de ce fichier et les enregistrer maintenant ? Les modifications non enregistrées de ce formulaire seront perdues."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_READING="Importation…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_DONE="%imported% paramètres importés et enregistrés. Rechargement de la page…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_DONE="Enregistré sous %name%."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_TITLE="Petites images"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DESC="Créez dès maintenant les petites images de toutes les tuiles de catégorie, pour qu'aucun visiteur ne les attende. Utilise la largeur et la qualité de ce formulaire : enregistrez aussi les paramètres."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_GENERATE="Générer les petites images maintenant"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEAR="Supprimer les petites images"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_RUNNING="En cours… %ready% images sur %total% ont leurs petites images."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DONE="Terminé : %ready% images sur %total% ont leurs petites images (%skipped% utilisent l'original : externes, petites ou illisibles)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEAR_CONFIRM="Supprimer toutes les petites images ? Elles seront recréées lors des prochaines visites ou avec « Générer les petites images maintenant »."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEARED="Fichiers supprimés : %deleted%."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_WORKING="En cours…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_FAILED="Échec : "
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NOT_ALLOWED="Vous n'êtes pas autorisé à utiliser cet outil."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NOT_ALLOWED_EDIT="Vous n'êtes pas autorisé à modifier les paramètres du plugin."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NO_STORE="Aucune application boutique Gridbox trouvée."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_GENERIC="Une erreur s'est produite. Les détails se trouvent dans le journal des erreurs de Joomla (activez Débogage du système pour les voir ici)."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_SIZE="Le fichier est vide ou trop volumineux (max. 256 Ko)."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_FILE="Ce n'est pas un fichier de paramètres Better Categories."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_EMPTY="Le fichier ne contient aucun paramètre de ce plugin."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_THUMBS_OFF="Les petites images rapides sont désactivées."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NO_WEBP="Le PHP (GD) de ce serveur ne peut pas écrire d'images WebP."
PLG_SYSTEM_BETTERCATEGORIES_DIAGNOSTICS_LABEL="Commentaire de diagnostic"
PLG_SYSTEM_BETTERCATEGORIES_DIAGNOSTICS_DESC="Ajoute aux pages de la boutique un commentaire HTML avec la version du plugin, l'empreinte des paramètres, le type d'appareil, l'état du cache et le temps passé : utile pour comparer ce que reçoivent les visiteurs sur ordinateur et sur téléphone. Laissez-le désactivé sur un site en production (il est toujours ajouté lorsque Débogage du système de Joomla est activé)."
