PLG_SYSTEM_BETTERCATEGORIES_HIDE_PRODUCTS_DESC="Sur l'accueil de la boutique et sur les catégories qui ont des sous-catégories, masque la liste des produits Gridbox pour que les visiteurs choisissent d'abord une catégorie. Les produits apparaissent sur les catégories de dernier niveau. Les résultats de recherche ne sont pas concernés."
