PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_MOBILE_DESC="Comment les téléphones affichent les sous-catégories (détectés par le navigateur, comme le paramètre de colonnes pour téléphone). Automatique transforme le retournement de carte et le panneau latéral, trop petits sur une vignette étroite, en panneau déroulant. L'aperçu en direct montre le mode ordinateur."
