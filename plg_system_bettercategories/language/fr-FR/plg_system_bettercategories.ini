; 1.2.0 — navigation and SEO
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV="Navigation et SEO"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV_DESC="Navigation au dernier niveau de l'arborescence et données structurées pour les moteurs de recherche."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_LABEL="Catégories voisines au dernier niveau"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_DESC="Une catégorie sans sous-catégories affiche une barre avec les catégories voisines (l'actuelle mise en évidence) et un lien de retour vers la catégorie parente, afin que les clients puissent changer de catégorie sans revenir en arrière. Les produits en dessous ne changent pas. Sur les téléphones, la barre défile latéralement."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_LABEL="Titre de la barre"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_DESC="Vide = pas de titre."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_LABEL="Lien de retour vers la catégorie parente"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_LABEL="Texte du lien de retour"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_DESC="%s est remplacé par le nom de la catégorie parente (ou de la boutique pour les catégories principales)."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_LABEL="Données structurées : liste des catégories"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_DESC="Ajoute les catégories listées sous forme de schema.org ItemList (JSON-LD) pour les moteurs de recherche."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_LABEL="Données structurées : fil d'Ariane"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_DESC="Ajoute un schema.org BreadcrumbList : boutique → catégories parentes → catégorie actuelle. Automatique ne l'ajoute que si la page n'a pas déjà ses propres données de fil d'Ariane (par exemple d'un module fil de navigation), afin qu'il n'y en ait jamais deux."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_AUTO="Automatique"

; 1.3.0 — price "from", first row, tools
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_LABEL="Afficher le prix le plus bas"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_DESC="Affiche sous chaque catégorie le prix le plus bas de ses produits (sous-catégories comprises) : le prix promotionnel s'il existe, y compris les promotions de la boutique et les déclinaisons de produits, dans la devise de la boutique. Les produits sans prix sont ignorés."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_LABEL="Texte du prix"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_DESC="%s est remplacé par le prix avec la devise, par ex. « à partir de %s » ou « à partir de %s HT »."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_COLOR_LABEL="Couleur du prix"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_LABEL="Charger la première ligne immédiatement"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_DESC="Les images de la première ligne de vignettes (autant que de colonnes sur l'appareil du visiteur) se chargent immédiatement avec une priorité élevée ; les autres lors du défilement. Accélère la partie visible de la page (LCP dans PageSpeed)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_TITLE="Fichier de paramètres"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_DESC="Enregistrez les paramètres de ce formulaire dans un fichier, ou chargez-les depuis un fichier (par ex. d'un autre site). « Styles uniquement » exclut ce qui est propre à ce site : ID des boutiques, ID des éléments, images des catégories et filtres. « Rétablir les valeurs par défaut » rétablit les valeurs d'une nouvelle installation."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_ALL="Exporter tous les paramètres"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_STYLES="Exporter uniquement les styles"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT="Importer depuis un fichier…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_STYLES_ONLY="Importer uniquement les styles (conserver les ID des boutiques, les ID des éléments, les images des catégories et les filtres de ce site)"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_CONFIRM="Importer les paramètres de ce fichier et les enregistrer maintenant ? Les modifications non enregistrées de ce formulaire seront perdues."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_READING="Importation…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_DONE="%imported% paramètres importés et enregistrés. Rechargement de la page…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_DONE="Enregistré sous %name%."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_TITLE="Miniatures"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DESC="Créer maintenant les miniatures de toutes les vignettes de catégories, afin qu'aucun visiteur ne les attende. Utilise la largeur et la qualité de ce formulaire — enregistrez aussi les paramètres."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_GENERATE="Générer les miniatures maintenant"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEAR="Supprimer les miniatures"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_RUNNING="Traitement en cours… %ready% images sur %total% ont des miniatures."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DONE="Terminé : %ready% images sur %total% ont des miniatures (%skipped% utilisent l'original : externes, petites ou illisibles)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEAR_CONFIRM="Supprimer toutes les miniatures ? Elles seront recréées lors des prochaines visites ou avec « Générer les miniatures maintenant »."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEARED="%deleted% fichiers supprimés."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_WORKING="Traitement en cours…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_FAILED="Échec : "
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NOT_ALLOWED="Vous n'êtes pas autorisé à utiliser cet outil."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NOT_ALLOWED_EDIT="Vous n'êtes pas autorisé à modifier les paramètres du plugin."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NO_STORE="Aucune application boutique Gridbox trouvée."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_GENERIC="Une erreur s'est produite. Les détails se trouvent dans le journal d'erreurs de Joomla (activez Débogage du système pour les voir ici)."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_SIZE="Le fichier est vide ou trop volumineux (max. 256 Ko)."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_FILE="Ce n'est pas un fichier de paramètres Better Categories."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_EMPTY="Le fichier ne contient aucun paramètre de ce plugin."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_THUMBS_OFF="Les miniatures rapides sont désactivées."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NO_WEBP="Le PHP (GD) de ce serveur ne peut pas écrire d'images WebP."
