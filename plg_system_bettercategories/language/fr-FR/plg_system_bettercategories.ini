PLG_SYSTEM_BETTERCATEGORIES_CACHE_DESC="La liste terminée est enregistrée et réutilisée, afin de ne pas ralentir les pages de catégorie. 0 = pas de cache. Les produits et catégories nouveaux ou modifiés apparaissent après ce délai ; l'enregistrement de ces paramètres vide immédiatement le cache (ainsi que les caches de pages Joomla/Gridbox)."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_NO_GRIDBOX="Better Categories for Gridbox : Balbooa Gridbox (com_gridbox) n'est pas installé sur ce site, le plugin n'a donc encore rien à faire."
