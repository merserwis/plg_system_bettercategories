PLG_SYSTEM_BETTERCATEGORIES_CACHE_LABEL="Durée du cache (minutes)"
PLG_SYSTEM_BETTERCATEGORIES_CACHE_DESC="La liste générée est conservée et réutilisée pour ne pas ralentir les pages de catégorie. 0 = pas de cache. Les produits et catégories nouveaux ou modifiés apparaissent après ce délai ; l'enregistrement de ces paramètres vide immédiatement le cache (ainsi que les caches de pages de Joomla et de Gridbox)."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_NO_GRIDBOX="Better Categories for Gridbox : Balbooa Gridbox (com_gridbox) n'est pas installé sur ce site, le plugin n'a donc encore rien à faire."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_OLD_DISABLED="Better Categories for Gridbox : l'ancien plugin Gridbox Subcategories (plg_system_gbsubcats) a été désactivé pour que la liste n'apparaisse pas deux fois. Vous pouvez le désinstaller."
PLG_SYSTEM_BETTERCATEGORIES_FILL_LABEL="Lorsqu'il y a moins d'éléments que de colonnes"
PLG_SYSTEM_BETTERCATEGORIES_FILL_DESC="Par exemple 6 colonnes mais seulement 3 sous-catégories : les garder à gauche, les centrer (même largeur que dans une ligne complète) ou les étirer sur toute la largeur du module. Appliqué par appareil."
PLG_SYSTEM_BETTERCATEGORIES_FILL_LEFT="Aligner à gauche"
PLG_SYSTEM_BETTERCATEGORIES_FILL_CENTER="Centrer"
PLG_SYSTEM_BETTERCATEGORIES_FILL_STRETCH="Étirer sur toute la largeur"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_SUB="Sous-catégories"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_SUB_DESC="Afficher, sur chaque catégorie, les sous-catégories qu'elle contient."
PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_LABEL="Afficher le contenu"
PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_DESC="Comment chaque catégorie affiche ses propres sous-catégories. Tiroir : s'ouvre en dessous et pousse la mise en page vers le bas. Panneau latéral : glisse par-dessus la tuile. Carte retournée : la tuile se retourne et son dos liste les sous-catégories. Infobulle : une petite bulle au-dessus de la catégorie. Le panneau latéral et la carte retournée nécessitent des tuiles ; avec des liens texte, ils fonctionnent comme un tiroir. Sur les écrans tactiles et pour les utilisateurs du clavier, un petit bouton + ouvre le panneau."
PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_NONE="Ne pas afficher"
PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_BELOW="Texte sous le nom de la catégorie"
PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_DRAWER="Tiroir déroulant vers le bas (pousse la mise en page)"
PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_SIDE="Panneau glissant depuis le côté"
PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_FLIP="Carte retournée (liste au dos)"
PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_TOOLTIP="Infobulle"
PLG_SYSTEM_BETTERCATEGORIES_SUB_TRIGGER_LABEL="Ouvrir au"
PLG_SYSTEM_BETTERCATEGORIES_SUB_TRIGGER_DESC="Survol de la souris et bouton +, ou uniquement le bouton +. Sur les écrans tactiles, le bouton est toujours utilisé."
PLG_SYSTEM_BETTERCATEGORIES_SUB_TRIGGER_HOVER="Survol de la souris et bouton"
PLG_SYSTEM_BETTERCATEGORIES_SUB_TRIGGER_CLICK="Bouton uniquement"
PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_MOBILE_LABEL="Sur téléphone"
PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_MOBILE_DESC="Comment les téléphones affichent les sous-catégories (détectés par le navigateur, comme le paramètre de colonnes pour téléphone). Automatique transforme la carte retournée et le panneau latéral, trop petits sur une tuile étroite, en panneau déroulant. L'aperçu en direct montre le mode ordinateur."
