; 1.2.0 — thumbnails
PLG_SYSTEM_BETTERCATEGORIES_THUMBS_LABEL="Miniatures rapides (WebP)"
PLG_SYSTEM_BETTERCATEGORIES_THUMBS_DESC="Les vignettes chargent de petites copies WebP des images au lieu des photos en taille réelle : une à la largeur de la vignette et une deux fois plus large pour les écrans haute définition. Elles sont créées une seule fois et conservées dans media/plg_system_bettercategories/thumbs ; une image modifiée en reçoit de nouvelles. Les images externes, les images qui ne sont pas plus grandes que la vignette et les serveurs sans prise en charge de WebP conservent l'image d'origine."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_LABEL="Largeur des miniatures (px)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_DESC="Largeur de la petite copie ; la grande est deux fois plus large. 480 convient pour 3 à 6 vignettes par ligne."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_LABEL="Qualité des miniatures (40–95)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_DESC="Qualité WebP. À 80, l'image ressemble à l'originale pour une fraction de sa taille."

; 1.2.0 — per level
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS="Par niveau"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS_DESC="Des paramètres différents pour les différents niveaux de l'arborescence des catégories, par ex. de grandes vignettes avec image sur la page d'accueil de la boutique et des liens texte compacts plus en profondeur. Chaque champ vide conserve le paramètre principal. Choisissez une catégorie dans l'aperçu en direct pour voir son niveau."
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_LABEL="Paramètres par niveau"
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_DESC="Une ligne par niveau. Si un niveau a plusieurs lignes, la première s'applique."
