; 1.5.0 — product filters, reset
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS="Filtres"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS_DESC="Filtres de produits sur les pages de catégorie de la boutique : prix, champs de liste Gridbox, paramètres techniques lus dans les descriptions des produits et caractéristiques qui y figurent. La liste des produits reste celle de Gridbox — seuls moins de produits sont affichés."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ENABLED_LABEL="Filtres de produits"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ENABLED_DESC="Afficher un panneau de filtres sur les pages de catégorie de la boutique. Désactivé par défaut."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_LABEL="Filtres"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_DESC="Les filtres dans l'ordre d'affichage. Avec une liste vide : le prix et chaque champ de liste (liste déroulante, bouton radio, case à cocher) de la boutique. Au sein d'un filtre, une seule option choisie suffit (sauf si « toutes » est défini) ; les différents filtres doivent tous correspondre."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_LABEL="Filtrer par"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_DESC="Prix : de–à. Champ Gridbox : les options d'un champ de liste. Paramètre technique : valeurs avec une unité lues dans le titre et la description du produit (1000 V, 2,5 kV, CAT IV, IP67). Caractéristique : mots trouvés dans la description (par ex. Bluetooth). En promotion / En stock : une case à cocher."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_PRICE="Prix"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_FIELD="Champ Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_PARAM="Paramètre technique (de la description)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_FEATURE="Caractéristiques (mots de la description)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_SALE="En promotion"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_STOCK="En stock"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LABEL_LABEL="Titre"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LABEL_HINT="Automatique"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_LABEL="Champ Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_DESC="Un champ des produits (Gridbox → Applications → la boutique → Champs). Les champs texte listent chaque texte utilisé."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_SELECT="- Sélectionner un champ -"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_DIM_LABEL="Paramètre"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_DIM_DESC="Cochez-en un ou plusieurs. Chaque paramètre coché est un filtre à part entière sur le site, affiché uniquement dans les catégories dont les produits l'ont — une seule ligne peut ainsi servir toutes les pages de la boutique (par ex. tension et CAT pour les multimètres, humidité, pression et vitesse de l'air pour le CVC-R). Les unités d'une même grandeur correspondent à la même valeur : 1 kV = 1000 V, 16 bar = 1.6 MPa, 2 l/min = 0.12 m³/h, 68 °F = 20 °C."
PLG_SYSTEM_BETTERCATEGORIES_DIM_V="Tension (V)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_A="Courant (A)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_W="Puissance (W)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_VA="Puissance apparente (VA)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_HZ="Fréquence (Hz)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_OHM="Résistance (Ω)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_F="Capacité (F)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_C="Température (°C, °F)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_DB="Niveau sonore (dB)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_LX="Éclairement (lx)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_PA="Pression (Pa, hPa, kPa, mbar, bar, psi)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_WH="Énergie (Wh)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_AH="Capacité de la batterie (Ah)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_M="Longueur (m)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_CAT="Catégorie de mesure (CAT)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_IP="Indice de protection (IP)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_LABEL="Afficher comme"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_DESC="Valeurs : une case à cocher pour chaque valeur trouvée (600 V, 1000 V…). Plage : champs « de–à »."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_VALUES="Valeurs"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_RANGE="Plage (de–à)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_LABEL="Valeur d'un produit"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_DESC="Une description cite souvent plusieurs valeurs d'un même type (un multimètre : avertissement 30 V, 500 V, plage 1000 V). La plus élevée : le produit est pris en compte avec sa valeur la plus élevée (par ex. la plage de mesure), la plus basse : avec sa valeur la plus basse, n'importe laquelle : avec chaque valeur trouvée."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_MAX="Valeur la plus élevée"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_MIN="Valeur la plus basse"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_ANY="N'importe quelle valeur trouvée"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_LABEL="Caractéristiques"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_DESC="Une caractéristique par ligne : <code>Nom = mot, autre mot</code>. Un produit possède la caractéristique lorsque son titre ou sa description contient l'un des mots (mots entiers, sans tenir compte de la casse ; les espaces et les traits d'union sont équivalents). Un mot se terminant par <code>*</code> correspond aussi aux mots plus longs. Sans « = », c'est le nom lui-même qui est recherché."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_HINT="True RMS = true rms, trms"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_LABEL="Plusieurs options choisies"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_DESC="L'une d'entre elles : un produit doit avoir l'une des options choisies. Toutes : un produit doit avoir chaque option choisie. Automatique : « toutes » pour les caractéristiques, « l'une d'entre elles » pour le reste."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_AUTO="Automatique"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_OR="L'une d'entre elles"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_AND="Toutes"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_LABEL="Ordre des options"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_AUTO="Comme dans Gridbox / la liste"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_COUNT="Le plus de produits en premier"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_ALPHA="Alphabétique"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_LABEL="Nom dans l'adresse"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_DESC="Le filtre apparaît dans l'adresse sous la forme <code>?f-name=…</code>. Vide = créé à partir du titre. Ne le modifiez qu'avant de partager des liens vers des pages filtrées."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_HINT="À partir du titre"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_COLLAPSED_LABEL="Replié au départ"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_LABEL="Position du panneau"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DESC="Barre latérale : une colonne à côté de la liste des produits. Au-dessus des produits : les filtres sur une ligne, chacun s'ouvrant comme un menu. Bouton : un bouton « Filtres » ouvre le panneau depuis le côté. Après l'élément des catégories : sous l'arborescence des catégories de Gridbox (souvent dans la colonne latérale de la page). Avant / après un élément : n'importe quel élément Gridbox par son id. Si l'élément est absent, le panneau est placé au-dessus des produits. Dans la colonne latérale : en haut ou en bas de la colonne à côté de la liste des produits (par ex. avec l'arborescence des catégories ou les contacts), trouvée automatiquement."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_LEFT="Barre latérale à gauche"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_RIGHT="Barre latérale à droite"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_TOP="Au-dessus des produits (une ligne)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DRAWER="Bouton « Filtres » (panneau latéral)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_AFTER_CATEGORIES="Après l'élément des catégories de Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_BEFORE_ITEM="Avant un élément Gridbox choisi"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_AFTER_ITEM="Après un élément Gridbox choisi"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ITEM_ID_DESC="L'attribut id d'un élément de la mise en page de la boutique (par ex. item-15003687280). Vous le trouverez dans l'éditeur Gridbox ou dans le code source de la page."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_LABEL="Sur les téléphones"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_DESC="Bouton : un bouton « Filtres » au-dessus des produits ouvre le panneau depuis le côté (également dans les fenêtres étroites). Comme sur ordinateur : le panneau reste à sa place sur ordinateur."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_DRAWER="Bouton « Filtres »"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_SAME="Comme sur ordinateur"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_LABEL="Appliquer"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_DESC="Immédiatement : chaque modification affiche aussitôt les produits (sans recharger la page). Avec un bouton : le visiteur fait son choix puis clique sur « Appliquer »."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_AUTO="Immédiatement"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_BUTTON="Avec un bouton « Appliquer »"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_COUNTS_LABEL="Nombre de produits à côté des options"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_HIDE_EMPTY_LABEL="Masquer les options sans produits"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_HIDE_EMPTY_DESC="Les options qui n'afficheraient aucun produit avec les filtres déjà choisis sont masquées. Désactivé : elles restent visibles, grisées."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MORE_LABEL="Options affichées au départ"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MORE_DESC="Les autres options d'un filtre se trouvent derrière « Afficher plus ». 0 = toutes."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MIN_LABEL="Nombre minimal de produits"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MIN_DESC="Le panneau apparaît dans les catégories comptant au moins ce nombre de produits."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_NOINDEX_LABEL="Pages filtrées : noindex"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_NOINDEX_DESC="Les listes filtrées reçoivent <code>robots: noindex, follow</code>, afin que les moteurs de recherche indexent la page de catégorie elle-même et non chaque combinaison de filtres."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_WIDTH_LABEL="Largeur de la barre latérale (px)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_WIDTH_DESC="160–600."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_FONT_LABEL="Taille de police (px)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ACCENT_LABEL="Couleur d'accent"
