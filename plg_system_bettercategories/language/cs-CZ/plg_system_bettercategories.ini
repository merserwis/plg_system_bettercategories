PLG_SYSTEM_BETTERCATEGORIES_FILTER_CATEGORIES_LABEL="Pouze v kategoriích"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_CATEGORIES_DESC="Filtr se zobrazí jen v těchto kategoriích a jejich podkategoriích, např. vlhkost, tlak a rychlost proudění vzduchu jen v HVACR, napětí a CAT jen u měřicích přístrojů. Prázdné = v každé kategorii."
PLG_SYSTEM_BETTERCATEGORIES_CARDS_ALIGN_LABEL="Karty produktů v rovných řadách"
PLG_SYSTEM_BETTERCATEGORIES_CARDS_ALIGN_DESC="V rozvržení Masonry v Gridboxu stojí každá karta produktu hned pod kartou nad ní, takže kratší název nebo popis posune celý sloupec nahoru a řady se rozjedou. S touto volbou začínají karty v řadě společně, jsou vysoké jako ta nejvyšší a cena je dole na každé kartě — v jedné linii v celé řadě. Funguje s rozvržením Masonry i Grid seznamu produktů, na každé stránce seznamu; soubory Gridboxu se nemění."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_EXCLUDE_LABEL="Mimo kategorie"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_EXCLUDE_DESC="Filtr se nikdy nezobrazí v těchto kategoriích a jejich podkategoriích — např. obecný filtr nadřazené kategorie v podkategorii, která má vlastní filtry."
