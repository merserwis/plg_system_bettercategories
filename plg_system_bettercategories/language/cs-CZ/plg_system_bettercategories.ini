PLG_SYSTEM_BETTERCATEGORIES_ICON_COLOR_DESC="Prázdné = barva textu (v dlaždicích: barva odkazů)."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_ICON_LABEL="Ikona"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_ICON_DESC="Ikona před názvem skupiny filtrů: <em>Vybrat…</em> otevře ikony Font Awesome Free (hledejte anglicky: fire, gas, phone), nebo napište třídy jiného ikonového písma webu (např. <code>zmdi zmdi-fire</code>). Soubor (SVG, PNG) ze správce médií má přednost. Soubory SVG: nejprve přidejte <code>svg</code> mezi povolené přípony v možnostech Médií Joomly."
