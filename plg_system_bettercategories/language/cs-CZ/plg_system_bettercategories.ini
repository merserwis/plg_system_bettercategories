PLG_SYSTEM_BETTERCATEGORIES_LIST_VIEW_DESC="Dvě tlačítka na konci lišty nad produkty: produkty jako mřížka (jak je zobrazuje Gridbox) nebo jako seznam — jeden na řádek, obrázek vlevo. Volbu si pamatuje prohlížeč návštěvníka, zobrazení se změní hned, bez načtení stránky. Také v kategoriích bez filtrů."
