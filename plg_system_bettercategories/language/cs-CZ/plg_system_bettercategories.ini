PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS="Per level"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS_DESC="Different settings for different levels of the category tree, e.g. large image tiles on the store home page and compact text links deeper down. Every empty field keeps the main setting. Pick a category in the live preview to see its level."
