PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_DESC="Adds the listed categories as a schema.org ItemList (JSON-LD) for search engines."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_LABEL="Structured data: breadcrumbs"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_DESC="Adds a schema.org BreadcrumbList: store → parent categories → current category. Automatic adds it only when the page has no breadcrumb data of its own (for example from a breadcrumbs module), so there are never two."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_AUTO="Automatic"

