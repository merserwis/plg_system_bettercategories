PLG_SYSTEM_BETTERCATEGORIES_SITE_LABEL_PAGED="Zobrazit po stránkách"
PLG_SYSTEM_BETTERCATEGORIES_SITE_LABEL_VIEW="Zobrazení"
PLG_SYSTEM_BETTERCATEGORIES_SITE_LABEL_GRID="Mřížka"
PLG_SYSTEM_BETTERCATEGORIES_SITE_LABEL_LIST="Seznam"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_FILTERS_MISSING="Vynecháno — tyto kategorie na tomto webu nejsou: %s."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_HIDE_COMMON_LABEL="Skrýt funkce společné všem produktům"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_HIDE_COMMON_DESC="Funkce (slova v popisu), kterou má každý produkt kategorie, nic nezužuje — např. „Protokoly“ v kategorii analyzátorů, které všechny vytvářejí protokoly: taková možnost se tam nenabízí (objeví se tam, kde ji mají jen některé produkty)."

; Category description (1.7.0)
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_DESC="Popis kategorie"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_DESC_DESC="Popis kategorie (Gridbox → obchod → Kategorie → kategorie → Popis) na její stránce: tam, kde ho má rozvržení kategorie, nebo na zvoleném místě, celý nebo zkrácený na začátek s tlačítkem."
PLG_SYSTEM_BETTERCATEGORIES_DESC_ENABLED_LABEL="Popis kategorie"
PLG_SYSTEM_BETTERCATEGORIES_DESC_ENABLED_DESC="Zobrazí popis kategorie na její stránce a na úvodní stránce obchodu popis obchodu. Gridbox vyplňuje svůj blok popisu jen v záhlaví kategorie; blok přesunutý jinam v rozvržení kategorie zůstane s textem „Category Description“. Po zapnutí dostane popis i takový blok, nebo popis přijde na místo zvolené níže — vždy jednou na stránce: ostatní bloky popisu se vyprázdní. Také v kategoriích bez podkategorií. Převzato z MerTools (nastavení Stránky kategorií), který to už nedělá."
PLG_SYSTEM_BETTERCATEGORIES_DESC_SEO_LABEL="Vyhledávače"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SEO_NOTE="Celý popis je v HTML stránky, jak ho posílá server, a jen jednou — přesunutý, ne zkopírovaný. Zkrácení jen omezuje jeho výšku v prohlížeči (žádné <code>display:none</code>, nic se nedonačítá) a tlačítko je <code>&lt;button&gt;</code>, ne odkaz, takže nepřidává žádnou adresu. Google takový text čte a hodnotí jako každý jiný (mobile-first indexování). Bez JavaScriptu se zobrazí celý text."
PLG_SYSTEM_BETTERCATEGORIES_DESC_POSITION_LABEL="Umístění na stránce"
PLG_SYSTEM_BETTERCATEGORIES_DESC_POSITION_DESC="Tam, kde ho má rozvržení: v bloku popisu Gridboxu — v záhlaví kategorie, nebo tam, kam byl blok v rozvržení kategorie přesunut. Ostatní místa jako u podkategorií; na stejném místě je popis první. Když zvolený prvek na stránce není, popis přijde nad produkty."
PLG_SYSTEM_BETTERCATEGORIES_DESC_POSITION_LAYOUT="Tam, kde ho má rozvržení kategorie"
PLG_SYSTEM_BETTERCATEGORIES_DESC_FIRST_PAGE_LABEL="Jen na první stránce"
PLG_SYSTEM_BETTERCATEGORIES_DESC_FIRST_PAGE_DESC="Další stránky seznamu produktů (?page=2…) popis nezobrazují, aby stránky jedné kategorie neopakovaly stejný dlouhý text (duplicitní obsah)."
PLG_SYSTEM_BETTERCATEGORIES_DESC_TIDY_LABEL="Uklidit mezery"
PLG_SYSTEM_BETTERCATEGORIES_DESC_TIDY_DESC="Odstraní, co zanechává editor: prázdné odstavce (<code>&lt;p&gt;&amp;nbsp;&lt;/p&gt;</code>) a zalomení řádku na začátku nebo konci nadpisů a odstavců, která dělají velké mezery. Text, nadpisy, seznamy a odkazy zůstanou beze změny."
PLG_SYSTEM_BETTERCATEGORIES_DESC_MARGIN_TOP_LABEL="Mezera nad popisem (px)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_MARGIN_BOTTOM_LABEL="Mezera pod popisem (px)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_FOLD_LABEL="Zobrazit jen začátek"
PLG_SYSTEM_BETTERCATEGORIES_DESC_FOLD_DESC="Dlouhý popis je zobrazen do výšky nastavené níže, s postupným zeslabením, a s tlačítkem, které otevře zbytek (jako na stránkách výrobců). Popis jen o trochu vyšší se zobrazí celý, bez tlačítka."
PLG_SYSTEM_BETTERCATEGORIES_DESC_HEIGHT_LABEL="Výška začátku (px)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_HEIGHT_DESC="Kolik popisu je vidět nad tlačítkem; 180 px je asi 6–7 řádků textu."
PLG_SYSTEM_BETTERCATEGORIES_DESC_HEIGHT_MOBILE_LABEL="Výška na telefonech (px)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_HEIGHT_MOBILE_DESC="Obrazovky do šířky 767 px. 0 = stejně jako výše."
PLG_SYSTEM_BETTERCATEGORIES_DESC_FADE_LABEL="Zeslabení"
PLG_SYSTEM_BETTERCATEGORIES_DESC_FADE_DESC="Poslední řádky začátku postupně mizí, aby bylo jasné, že text pokračuje. Funguje na jakémkoli pozadí, i v tmavém režimu."
PLG_SYSTEM_BETTERCATEGORIES_DESC_MORE_LABEL="Text tlačítka"
PLG_SYSTEM_BETTERCATEGORIES_DESC_MORE_DESC="Prázdné = v jazyce webu („Číst dál“, „Zobrazit méně“)."
