PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_TITLE="Malé obrázky"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DESC="Vytvořte malé obrázky všech dlaždic kategorií hned teď, aby na ně žádný návštěvník nečekal. Použije šířku a kvalitu z tohoto formuláře — nastavení také uložte."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_GENERATE="Vytvořit malé obrázky"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEAR="Smazat malé obrázky"
