PLG_SYSTEM_BETTERCATEGORIES_ICON_TILES_DESC="<em>Když chybí obrázek</em>: kategorie bez obrázku ukáže na jeho místě velkou ikonu. <em>Místo obrázku</em>: vždy ikona. <em>Malá, před názvem</em>: obrázek zůstane, ikona je před názvem. <em>Vypnuto</em>: v dlaždicích žádné ikony."
