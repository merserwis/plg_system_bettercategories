PLG_SYSTEM_BETTERCATEGORIES_SHOW_ALL_LABEL="Tlačítko „Zobrazit vše“"
PLG_SYSTEM_BETTERCATEGORIES_SHOW_ALL_DESC="Odkaz na konci lišty nad produkty, když má kategorie více produktů než jedna stránka seznamu: všechny na jedné stránce (do limitu níže), s vybranými filtry a řazením; „Zobrazit po stránkách“ se vrátí. Taková stránka se neindexuje."
PLG_SYSTEM_BETTERCATEGORIES_SHOW_ALL_MAX_LABEL="„Zobrazit vše“: nejvýše"
PLG_SYSTEM_BETTERCATEGORIES_SHOW_ALL_MAX_DESC="Produktů na stránce se všemi (20–2000) — stránka s tisíci produkty by se načítala příliš dlouho."
