; 1.2.0 — thumbnails
PLG_SYSTEM_BETTERCATEGORIES_THUMBS_LABEL="Fast thumbnails (WebP)"
PLG_SYSTEM_BETTERCATEGORIES_THUMBS_DESC="Tiles load small WebP copies of the images instead of the full-size photos: one at the tile width and one twice as wide for sharp screens. They are made once and kept in media/plg_system_bettercategories/thumbs; a changed image gets new ones. External images, images not larger than the tile and servers without WebP support keep the original image."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_LABEL="Thumbnail width (px)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_DESC="Width of the smaller copy; the larger one is twice as wide. 480 suits 3–6 tiles per row."
