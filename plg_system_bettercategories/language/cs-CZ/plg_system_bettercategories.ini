PLG_SYSTEM_BETTERCATEGORIES_DIAGNOSTICS_DESC="Přidá na stránky obchodu komentář HTML s verzí pluginu, otiskem nastavení, typem zařízení, stavem mezipaměti a spotřebovaným časem — užitečné pro porovnání toho, co dostávají návštěvníci na počítači a na telefonu. Na ostrém webu ho nechte vypnutý (při zapnutém Ladění systému Joomla se přidává vždy)."
