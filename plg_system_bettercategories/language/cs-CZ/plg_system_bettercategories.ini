PLG_SYSTEM_BETTERCATEGORIES_FILTER_MIN_DESC="Parametr se v kategorii zobrazí, když ho má alespoň tolik jejích produktů — hodnota zmíněná jen u jednoho produktu (často jen okrajově) se nezobrazí."
