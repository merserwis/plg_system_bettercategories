; 1.5.0 — product filters, reset
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS="Filtry"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS_DESC="Filtry produktů na stránkách kategorií obchodu: cena, seznamová pole Gridbox, technické parametry načtené z popisů produktů a vlastnosti v nich nalezené. Seznam produktů zůstává vlastním seznamem Gridbox — jen se zobrazí méně produktů."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ENABLED_LABEL="Filtry produktů"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ENABLED_DESC="Zobrazit panel filtrů na stránkách kategorií obchodu. Ve výchozím stavu vypnuto."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_LABEL="Filtry"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_DESC="Filtry v pořadí, v jakém se zobrazí. Při prázdném seznamu: cena a každé seznamové pole (výběr, přepínač, zaškrtávací pole) obchodu. V rámci jednoho filtru stačí kterákoli zvolená možnost (pokud není nastaveno „všechny“); různé filtry musí platit všechny."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_LABEL="Filtrovat podle"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_DESC="Cena: od–do. Pole Gridbox: možnosti seznamového pole. Technický parametr: hodnoty s jednotkou načtené z názvu a popisu produktu (1000 V, 2,5 kV, CAT IV, IP67). Vlastnost: slova nalezená v popisu (např. Bluetooth). Ve slevě / Skladem: jedno zaškrtávací pole."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_PRICE="Cena"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_FIELD="Pole Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_PARAM="Technický parametr (z popisu)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_FEATURE="Vlastnosti (slova v popisu)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_SALE="Ve slevě"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_STOCK="Skladem"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LABEL_LABEL="Název"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LABEL_HINT="Automaticky"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_LABEL="Pole Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_DESC="Pole produktů (Gridbox → Aplikace → obchod → Pole). U textových polí se zobrazí každý použitý text."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_SELECT="- Vyberte pole -"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_DIM_LABEL="Parametr"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_DIM_DESC="Zaškrtněte jeden nebo více. Každý zaškrtnutý parametr je na webu samostatným filtrem a zobrazí se jen v kategoriích, jejichž produkty ho mají — jeden řádek tak může sloužit všem stránkám obchodu (např. napětí a CAT pro měřicí přístroje, vlhkost, tlak a rychlost proudění vzduchu pro HVACR). Jednotky téhož druhu jsou stejná hodnota: 1 kV = 1000 V, 16 bar = 1,6 MPa, 2 l/min = 0,12 m³/h, 68 °F = 20 °C."
PLG_SYSTEM_BETTERCATEGORIES_DIM_V="Napětí (V)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_A="Proud (A)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_W="Výkon (W)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_VA="Zdánlivý výkon (VA)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_HZ="Frekvence (Hz)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_OHM="Odpor (Ω)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_F="Kapacita (F)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_C="Teplota (°C, °F)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_DB="Hladina zvuku (dB)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_LX="Osvětlenost (lx)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_PA="Tlak (Pa, hPa, kPa, mbar, bar, psi)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_WH="Energie (Wh)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_AH="Kapacita baterie (Ah)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_M="Délka (m)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_CAT="Kategorie měření (CAT)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_IP="Stupeň krytí (IP)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_LABEL="Zobrazit jako"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_DESC="Hodnoty: zaškrtávací pole pro každou nalezenou hodnotu (600 V, 1000 V…). Rozsah: pole „od–do“."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_VALUES="Hodnoty"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_RANGE="Rozsah (od–do)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_LABEL="Hodnota produktu"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_DESC="Popis obvykle uvádí více hodnot jednoho druhu (měřicí přístroj: varování 30 V, rozsah 500 V, 1000 V). Nejvyšší: produkt se počítá se svou nejvyšší hodnotou (např. měřicím rozsahem), nejnižší: se svou nejnižší, kterákoli: s každou nalezenou hodnotou."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_MAX="Nejvyšší hodnota"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_MIN="Nejnižší hodnota"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_ANY="Kterákoli nalezená hodnota"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_LABEL="Vlastnosti"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_DESC="Jedna vlastnost na řádek: <code>Název = slovo, jiné slovo</code>. Produkt má vlastnost, když jeho název nebo popis obsahuje jedno ze slov (celá slova, na velikosti písmen nezáleží; mezery a spojovníky se považují za shodné). Slovo zakončené <code>*</code> odpovídá i delším slovům. Bez „=“ se hledá samotný název."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_HINT="True RMS = true rms, trms"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_LABEL="Zvoleno více možností"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_DESC="Kterákoli z nich: produkt musí mít jednu ze zvolených možností. Všechny: produkt musí mít každou zvolenou možnost. Automaticky: „všechny“ pro vlastnosti, „kterákoli z nich“ pro ostatní."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_AUTO="Automaticky"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_OR="Kterákoli z nich"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_AND="Všechny"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_LABEL="Pořadí možností"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_AUTO="Jako v Gridbox / v seznamu"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_COUNT="Nejvíce produktů nejdříve"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_ALPHA="Abecedně"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_LABEL="Název v adrese"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_DESC="Filtr se v adrese objeví jako <code>?f-nazev=…</code>. Prázdné = vytvoří se z názvu. Měňte jej jen předtím, než se odkazy na filtrované stránky začnou sdílet."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_HINT="Z názvu"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_COLLAPSED_LABEL="Na začátku sbalený"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_LABEL="Umístění panelu"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DESC="Boční panel: sloupec vedle seznamu produktů. Nad produkty: filtry v jednom řádku, každý se otevře jako nabídka. Tlačítko: tlačítko „Filtry“ otevře panel ze strany. Za prvkem kategorií: pod stromem kategorií Gridbox (často v bočním sloupci stránky). Před / za prvkem: libovolný prvek Gridbox podle jeho id. Pokud prvek chybí, panel se zobrazí nad produkty. V bočním sloupci: nahoře nebo dole ve sloupci vedle seznamu produktů (např. se stromem kategorií nebo kontakty), nalezeném automaticky."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_LEFT="Boční panel vlevo"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_RIGHT="Boční panel vpravo"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_TOP="Nad produkty (jeden řádek)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DRAWER="Tlačítko „Filtry“ (boční panel)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_AFTER_CATEGORIES="Za prvkem kategorií Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_BEFORE_ITEM="Před zvoleným prvkem Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_AFTER_ITEM="Za zvoleným prvkem Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ITEM_ID_DESC="Atribut id prvku v rozvržení stránky obchodu (např. item-15003687280). Najdete jej v editoru Gridbox nebo ve zdrojovém kódu stránky."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_LABEL="Na telefonech"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_DESC="Tlačítko: tlačítko „Filtry“ nad produkty otevře panel ze strany (i v úzkých oknech). Jako na počítačích: panel tam, kde je na počítačích."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_DRAWER="Tlačítko „Filtry“"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_SAME="Jako na počítačích"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_LABEL="Použití"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_DESC="Okamžitě: každá změna ihned zobrazí produkty (bez znovunačtení stránky). Tlačítkem: návštěvník vybere a pak klikne na „Použít“."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_AUTO="Okamžitě"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_BUTTON="Tlačítkem „Použít“"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_COUNTS_LABEL="Počet produktů u možností"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_HIDE_EMPTY_LABEL="Skrýt možnosti bez produktů"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_HIDE_EMPTY_DESC="Možnosti, které by s již zvolenými filtry nezobrazily žádné produkty, se skryjí. Vypnuto: zůstanou zobrazené šedě."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MORE_LABEL="Možnosti zobrazené na začátku"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MORE_DESC="Další možnosti filtru jsou skryté pod „Zobrazit více“. 0 = všechny."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MIN_LABEL="Minimální počet produktů"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MIN_DESC="Panel se zobrazí v kategoriích s alespoň tolika produkty."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_NOINDEX_LABEL="Filtrované stránky: noindex"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_NOINDEX_DESC="Filtrované seznamy dostanou <code>robots: noindex, follow</code>, takže vyhledávače indexují samotnou stránku kategorie, a ne každou kombinaci filtrů."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_WIDTH_LABEL="Šířka bočního panelu (px)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_WIDTH_DESC="160–600."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_FONT_LABEL="Velikost písma (px)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ACCENT_LABEL="Barva zvýraznění"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_BG_LABEL="Pozadí"
