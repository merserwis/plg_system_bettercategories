PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_FILTERS_CONFIRM="Přidat filtry z tohoto souboru k uloženým? Filtr se stejným „Názvem v adrese“ bude nahrazen. Neuložené změny v tomto formuláři budou ztraceny."
