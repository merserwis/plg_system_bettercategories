PLG_SYSTEM_BETTERCATEGORIES_EAGER_DESC="Images of the first row of tiles (as many as the columns on the visitor's device) load immediately with high priority; the rest when scrolled to. Speeds up the visible part of the page (LCP in PageSpeed)."
