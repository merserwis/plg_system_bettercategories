PLG_SYSTEM_BETTERCATEGORIES_DESC_SCHEMA_LABEL="Strukturovaná data: popis kategorie"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SCHEMA_DESC="Přidá schema.org CollectionPage: název kategorie, její popis jako prostý text (do 500 znaků) a adresu stránky — stejný text, jaký vidí návštěvníci. Automaticky ji přidá jen tehdy, když stránka nemá vlastní CollectionPage (např. z nastavení SEO Gridboxu), takže nikdy nejsou dvě."
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_LABEL="Samostatný úvod"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_DESC="Rozdělí popis: jeho začátek (krátký úvod) přijde na místo zvolené níže — např. pod záhlaví kategorie — a zbytek do umístění zvoleného výše, např. pod produkty. Každá část je na stránce jednou. U čáry nebo značky: tam, kde má popis vodorovnou čáru nebo odstavec jen se značkou (editor Gridboxu nemá tlačítko pro čáru: napište značku jako samostatný odstavec); popis bez nich se zobrazí celý v umístění zvoleném výše. Po prvním odstavci: bez úprav popisů — úvodem je první odstavec (s nadpisem nad ním)."
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_OFF="Ne (celý popis na jednom místě)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_MARKER="U vodorovné čáry nebo značky"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_PARAGRAPH="Po prvním odstavci"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_MARKER_LABEL="Značka"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_MARKER_DESC="Text odstavce, který označuje konec úvodu, např. --- nebo [více]. Samotný odstavec se nezobrazí. Vodorovná čára (&lt;hr&gt;) funguje vždy také."
PLG_SYSTEM_BETTERCATEGORIES_DESC_LEAD_POSITION_LABEL="Umístění úvodu"
PLG_SYSTEM_BETTERCATEGORIES_DESC_LEAD_POSITION_DESC="Kam přijde začátek. Vždy se zobrazí celý; zobrazení jen začátku (níže) platí pro zbytek."
PLG_SYSTEM_BETTERCATEGORIES_DESC_LEAD_MARGIN_TOP_LABEL="Mezera nad úvodem (px)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_LEAD_MARGIN_BOTTOM_LABEL="Mezera pod úvodem (px)"
PLG_SYSTEM_BETTERCATEGORIES_GB_ROWS_LABEL="Prvek Kategorie Gridboxu: otevření kliknutím na řádek"
PLG_SYSTEM_BETTERCATEGORIES_GB_ROWS_DESC="V prvku Kategorie Gridboxu (strom kategorií, často v postranním sloupci) kategorie s podkategoriemi je otevírá a zavírá kliknutím kamkoli na svůj řádek místo přechodu na svou stránku; řádek se po najetí zvýrazní. Na každé stránce s tímto prvkem. Převzato z MerTools (nastavení Stránky kategorií)."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_MERTOOLS_TAKEN="Better Categories for Gridbox převzal z MerTools (nastavení Stránky kategorií) popisy kategorií a řádky prvku Kategorie: viz karty Popis kategorie a Navigace a SEO."
