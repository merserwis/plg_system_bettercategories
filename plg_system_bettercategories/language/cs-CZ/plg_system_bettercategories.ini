PLG_SYSTEM_BETTERCATEGORIES_THUMBS_LABEL="Rychlé malé obrázky (WebP)"
PLG_SYSTEM_BETTERCATEGORIES_THUMBS_DESC="Dlaždice načítají malé kopie obrázků ve formátu WebP místo fotek v plné velikosti: jednu v šířce dlaždice a jednu dvakrát širší pro ostré displeje. Vytvoří se jednou a ukládají se v media/plg_system_bettercategories/thumbs; změněný obrázek dostane nové. Externí obrázky, obrázky ne větší než dlaždice a servery bez podpory WebP používají původní obrázek."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_LABEL="Šířka malého obrázku (px)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_DESC="Šířka menší kopie; větší je dvakrát širší. 480 vyhovuje pro 3–6 dlaždic v řádku."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_LABEL="Kvalita malých obrázků (40–95)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_DESC="Kvalita WebP. 80 vypadá jako originál při zlomku jeho velikosti."

; 1.2.0 — podle úrovně
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS="Podle úrovně"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS_DESC="Různá nastavení pro různé úrovně stromu kategorií, např. velké dlaždice s obrázky na úvodní stránce obchodu a kompaktní textové odkazy hlouběji. Každé prázdné pole ponechá hlavní nastavení. Vyberte kategorii v živém náhledu a uvidíte její úroveň."
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_LABEL="Nastavení úrovní"
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_DESC="Jeden řádek na úroveň. Pokud má úroveň více řádků, platí první."
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_LABEL="Úroveň"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_0="Úvodní stránka obchodu"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_1="Úroveň 1 — hlavní kategorie"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_2="Úroveň 2 — její podkategorie"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_3="Úroveň 3 a hlubší"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_INHERIT="— hlavní nastavení —"

; 1.2.0 — navigace a SEO
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV="Navigace a SEO"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV_DESC="Navigace na poslední úrovni stromu a strukturovaná data pro vyhledávače."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_LABEL="Sousední kategorie na poslední úrovni"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_DESC="Kategorie bez podkategorií zobrazí lištu se sousedními kategoriemi (aktuální je zvýrazněná) a odkaz zpět na nadřazenou, takže zákazníci mohou přepínat bez vracení. Produkty pod ní zůstávají beze změny. Na telefonech se lišta posouvá do strany."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_LABEL="Nadpis lišty"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_DESC="Prázdné = bez nadpisu."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_LABEL="Odkaz zpět na nadřazenou kategorii"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_LABEL="Text odkazu zpět"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_DESC="%s se nahradí názvem nadřazené kategorie (nebo obchodu u kategorií nejvyšší úrovně)."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_LABEL="Strukturovaná data: seznam kategorií"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_DESC="Přidá zobrazené kategorie jako schema.org ItemList (JSON-LD) pro vyhledávače."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_LABEL="Strukturovaná data: drobečková navigace"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_DESC="Přidá schema.org BreadcrumbList: obchod → nadřazené kategorie → aktuální kategorie. Automaticky ji přidá jen tehdy, když stránka nemá vlastní data drobečkové navigace (např. z modulu drobečkové navigace), takže nikdy nejsou dvoje."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_AUTO="Automaticky"

; 1.3.0 — cena „od“, první řádek, nástroje
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_LABEL="Zobrazit nejnižší cenu"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_DESC="Zobrazí pod každou kategorií nejnižší cenu jejích produktů (včetně podkategorií): akční cenu, pokud existuje, také výprodeje obchodu a varianty produktů, v měně obchodu. Produkty bez ceny se vynechají."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_LABEL="Text ceny"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_DESC="%s se nahradí cenou s měnou, např. „od %s“ nebo „od %s bez DPH“."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_COLOR_LABEL="Barva ceny"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_LABEL="Načíst první řádek ihned"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_DESC="Obrázky prvního řádku dlaždic (tolik, kolik je sloupců na zařízení návštěvníka) se načtou ihned s vysokou prioritou; ostatní až při posunutí k nim. Zrychlí viditelnou část stránky (LCP v PageSpeed)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_TITLE="Soubor nastavení"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_DESC="Uložte nastavení tohoto formuláře do souboru nebo je načtěte ze souboru (např. z jiného webu). „Pouze styly“ vynechá vše, co patří k tomuto webu: ID obchodů, ID prvku a obrázky kategorií."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_ALL="Exportovat celé nastavení"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_STYLES="Exportovat pouze styly"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT="Importovat ze souboru…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_STYLES_ONLY="Importovat pouze styly (ponechat ID obchodů, ID prvku a obrázky kategorií tohoto webu)"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_CONFIRM="Importovat nastavení z tohoto souboru a hned je uložit? Neuložené změny v tomto formuláři budou ztraceny."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_READING="Importuje se…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_DONE="Importováno a uloženo nastavení: %imported%. Stránka se znovu načítá…"
