PLG_SYSTEM_BETTERCATEGORIES_THUMBS_DESC="Dlaždice načítajú malé kópie obrázkov vo formáte WebP namiesto fotiek v plnej veľkosti: jednu na šírku dlaždice a jednu dvakrát širšiu pre ostré obrazovky. Vytvoria sa raz a uchovávajú sa v media/plg_system_bettercategories/thumbs; zmenený obrázok dostane nové. Externé obrázky, obrázky nie väčšie ako dlaždica a servery bez podpory WebP ponechajú pôvodný obrázok."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_LABEL="Šírka malého obrázka (px)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_DESC="Šírka menšej kópie; väčšia je dvakrát širšia. 480 vyhovuje pre 3–6 dlaždíc v riadku."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_LABEL="Kvalita malých obrázkov (40–95)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_DESC="Kvalita WebP. Pri 80 vyzerá obrázok ako originál pri zlomku jeho veľkosti."

; 1.2.0 — podľa úrovne
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS="Podľa úrovne"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS_DESC="Rôzne nastavenia pre rôzne úrovne stromu kategórií, napr. veľké dlaždice s obrázkami na úvodnej stránke obchodu a kompaktné textové odkazy na nižších úrovniach. Každé prázdne pole ponechá hlavné nastavenie. Vyberte kategóriu v živom náhľade a uvidíte jej úroveň."
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_LABEL="Nastavenia úrovní"
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_DESC="Jeden riadok na úroveň. Ak má úroveň viac riadkov, platí prvý."
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_LABEL="Úroveň"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_0="Úvodná stránka obchodu"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_1="Úroveň 1 — hlavná kategória"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_2="Úroveň 2 — jej podkategória"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_3="Úroveň 3 a nižšie"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_INHERIT="— hlavné nastavenie —"

; 1.2.0 — navigácia a SEO
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV="Navigácia a SEO"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV_DESC="Navigácia na poslednej úrovni stromu a štruktúrované údaje pre vyhľadávače."
