PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DESC="Vytvorte malé obrázky všetkých dlaždíc kategórií hneď teraz, aby na ne žiadny návštevník nečakal. Použije sa šírka a kvalita z tohto formulára — uložte aj nastavenia."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_GENERATE="Vytvoriť malé obrázky teraz"
