PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_DESC="Uložte nastavenia z tohto formulára do súboru alebo ich načítajte zo súboru (napr. z iného webu). „Iba štýly“ vynechá to, čo patrí k tomuto webu: ID obchodov, ID prvku a obrázky kategórií."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_ALL="Exportovať všetky nastavenia"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_STYLES="Exportovať iba štýly"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT="Importovať zo súboru…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_STYLES_ONLY="Importovať iba štýly (ponechať ID obchodov, ID prvku a obrázky kategórií tohto webu)"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_CONFIRM="Importovať nastavenia z tohto súboru a hneď ich uložiť? Neuložené zmeny v tomto formulári sa stratia."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_READING="Importuje sa…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_DONE="Importované a uložené nastavenia: %imported%. Stránka sa znova načítava…"
