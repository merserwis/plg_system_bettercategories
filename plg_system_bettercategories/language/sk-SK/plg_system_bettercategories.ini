PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_DESC="Kategória bez podkategórií zobrazí lištu so susednými kategóriami (aktuálna je zvýraznená) a odkaz späť na nadradenú, aby zákazníci mohli prepínať bez vracania sa. Produkty pod ňou zostanú bez zmeny. Na telefónoch sa lišta posúva do strán."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_LABEL="Nadpis lišty"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_DESC="Prázdne = bez nadpisu."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_LABEL="Odkaz späť na nadradenú kategóriu"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_LABEL="Text odkazu späť"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_DESC="%s sa nahradí názvom nadradenej kategórie (alebo obchodu pri kategóriách najvyššej úrovne)."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_LABEL="Štruktúrované údaje: zoznam kategórií"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_DESC="Pridá zobrazené kategórie ako schema.org ItemList (JSON-LD) pre vyhľadávače."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_LABEL="Štruktúrované údaje: navigačná cesta"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_DESC="Pridá schema.org BreadcrumbList: obchod → nadradené kategórie → aktuálna kategória. Automaticky ho pridá iba vtedy, keď stránka nemá vlastné údaje navigačnej cesty (napríklad z modulu navigačnej cesty), takže nikdy nie sú dvoje."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_AUTO="Automaticky"

