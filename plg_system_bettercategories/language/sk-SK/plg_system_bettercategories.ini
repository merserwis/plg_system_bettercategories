PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_LABEL="Text ceny"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_DESC="%s sa nahradí cenou s menou, napr. „od %s“ alebo „od %s bez DPH“."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_COLOR_LABEL="Farba ceny"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_LABEL="Načítať prvý riadok hneď"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_DESC="Obrázky prvého riadka dlaždíc (toľko, koľko je stĺpcov na zariadení návštevníka) sa načítajú okamžite s vysokou prioritou; ostatné až pri posunutí k nim. Zrýchli viditeľnú časť stránky (LCP v PageSpeed)."
