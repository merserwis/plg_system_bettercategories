PLG_SYSTEM_BETTERCATEGORIES="सिस्टम - Better Categories for Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_XML_DESCRIPTION="Better Categories for Gridbox: Gridbox स्टोर के श्रेणी पेजों पर (स्टोर होम पेज सहित) वर्तमान श्रेणी की उप-श्रेणियाँ उत्पादों की संख्या के साथ, टेक्स्ट लिंक या इमेज टाइल के रूप में दिखाता है। उत्पाद सूची, फ़िल्टर और सर्च नहीं बदलते। Joomla 6 / PHP 8.5।"
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_NO_GRIDBOX="Better Categories for Gridbox: इस साइट पर Balbooa Gridbox (com_gridbox) इंस्टॉल नहीं है, इसलिए प्लगइन के पास अभी करने को कुछ नहीं है।"
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_OLD_DISABLED="Better Categories for Gridbox: पुराना Gridbox Subcategories प्लगइन (plg_system_gbsubcats) बंद कर दिया गया, ताकि सूची दो बार न दिखे। आप उसे अनइंस्टॉल कर सकते हैं।"
