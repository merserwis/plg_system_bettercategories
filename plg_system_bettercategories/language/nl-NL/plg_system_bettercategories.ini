PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_DONE="%imported% instellingen geïmporteerd en opgeslagen. De pagina wordt opnieuw geladen…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_DONE="Opgeslagen als %name%."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_TITLE="Miniaturen"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DESC="Maak nu de miniaturen van alle categorietegels, zodat geen enkele bezoeker erop hoeft te wachten. Gebruikt de breedte en kwaliteit uit dit formulier — sla de instellingen ook op."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_GENERATE="Miniaturen nu maken"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEAR="Miniaturen verwijderen"
