PLG_SYSTEM_BETTERCATEGORIES_ICON_SIZE_LABEL="Pictogramgrootte (px)"
PLG_SYSTEM_BETTERCATEGORIES_ICON_SIZE_DESC="0 = automatisch: tekstgrootte in lijsten, 42% van de tegel in tegels."
PLG_SYSTEM_BETTERCATEGORIES_ICON_COLOR_LABEL="Pictogramkleur"
PLG_SYSTEM_BETTERCATEGORIES_ICON_COLOR_DESC="Leeg = tekstkleur (in tegels: linkkleur)."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_ICON_LABEL="Pictogram"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_ICON_DESC="Een pictogram vóór de titel van de filtergroep: <em>Kiezen…</em> opent de Font Awesome Free-pictogrammen (zoeken in het Engels: fire, gas, phone), of typ de klassen van een ander pictogramlettertype van de site (bijv. <code>zmdi zmdi-fire</code>). Een bestand (SVG, PNG) uit mediabeheer gaat voor. SVG-bestanden: voeg eerst <code>svg</code> toe aan de toegestane extensies in de Media-opties van Joomla."
PLG_SYSTEM_BETTERCATEGORIES_ICON_CHOOSE="Kiezen…"
