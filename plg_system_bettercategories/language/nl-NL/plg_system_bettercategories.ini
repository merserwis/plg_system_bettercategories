PLG_SYSTEM_BETTERCATEGORIES_ICON_TEXT_DESC="Het pictogram van een categorie (zie „Eigen categorieafbeeldingen en -pictogrammen”) vóór de naam in tekstlijsten."
PLG_SYSTEM_BETTERCATEGORIES_ICON_TILES_LABEL="Pictogrammen in tegels"
PLG_SYSTEM_BETTERCATEGORIES_ICON_TILES_DESC="<em>Als er geen afbeelding is</em>: een categorie zonder afbeelding toont daar groot haar pictogram. <em>In plaats van de afbeelding</em>: altijd het pictogram. <em>Klein, vóór de naam</em>: de afbeelding blijft, het pictogram staat vóór de naam. <em>Uit</em>: geen pictogrammen in tegels."
PLG_SYSTEM_BETTERCATEGORIES_ICON_TILES_FALLBACK="Als er geen afbeelding is"
PLG_SYSTEM_BETTERCATEGORIES_ICON_TILES_REPLACE="In plaats van de afbeelding"
