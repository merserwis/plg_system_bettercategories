PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SELECT_ALL="Alles selecteren"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SELECT_NONE="Alles wissen"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_CATEGORIES_LABEL="Alleen in categorieën"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_CATEGORIES_DESC="De filter verschijnt alleen in deze categorieën en hun subcategorieën, bijv. vochtigheid, druk en luchtsnelheid alleen onder HVACR, spanning en CAT alleen onder meters. Leeg = in elke categorie."
PLG_SYSTEM_BETTERCATEGORIES_CARDS_ALIGN_LABEL="Productkaarten in gelijke rijen"
PLG_SYSTEM_BETTERCATEGORIES_CARDS_ALIGN_DESC="In de Masonry-indeling van Gridbox staat elke productkaart direct onder de kaart erboven, waardoor een kortere titel of beschrijving de hele kolom omhoog schuift en de rijen niet meer gelijk lopen. Met deze optie beginnen de kaarten van een rij samen, zijn ze zo hoog als de hoogste, en staat de prijs onderaan elke kaart — op één lijn in de hele rij. Werkt met de indelingen Masonry en Grid van de productlijst, op elke pagina van de lijst; de bestanden van Gridbox worden niet gewijzigd."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_EXCLUDE_LABEL="Niet in categorieën"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_EXCLUDE_DESC="Het filter verschijnt nooit in deze categorieën en hun subcategorieën — bijv. een algemeen filter van een bovenliggende categorie in een subcategorie met eigen filters."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_FILTERS_ONLY="Alleen de filters uit het bestand toevoegen (overige instellingen en filters blijven)"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_FILTERS_CONFIRM="De filters uit dit bestand aan de opgeslagen filters toevoegen? Een filter met dezelfde „Naam in het adres” wordt vervangen. Niet-opgeslagen wijzigingen in dit formulier gaan verloren."
