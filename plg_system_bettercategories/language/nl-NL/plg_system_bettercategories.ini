PLG_SYSTEM_BETTERCATEGORIES_THUMBS_DESC="Tegels laden kleine WebP-kopieën van de afbeeldingen in plaats van de foto's op volle grootte: één op de breedte van de tegel en één twee keer zo breed voor scherpe schermen. Ze worden één keer gemaakt en bewaard in media/plg_system_bettercategories/thumbs; een gewijzigde afbeelding krijgt nieuwe. Externe afbeeldingen, afbeeldingen die niet groter zijn dan de tegel en servers zonder WebP-ondersteuning houden de originele afbeelding."
