PLG_SYSTEM_BETTERCATEGORIES_LEVELS_LABEL="Instellingen per niveau"
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_DESC="Eén rij per niveau. Heeft een niveau meer rijen, dan geldt de eerste."
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_LABEL="Niveau"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_0="Winkelstartpagina"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_1="Niveau 1 — een hoofdcategorie"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_2="Niveau 2 — haar subcategorie"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_3="Niveau 3 en dieper"
