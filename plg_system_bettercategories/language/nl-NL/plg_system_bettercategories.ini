; 1.5.0 — product filters, reset
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS="Filters"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS_DESC="Productfilters op categoriepagina's van de winkel: prijs, lijstvelden van Gridbox, technische parameters uit de productbeschrijvingen en kenmerken die daarin voorkomen. De productlijst blijft die van Gridbox zelf — er worden alleen minder producten getoond."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ENABLED_LABEL="Productfilters"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ENABLED_DESC="Toon een filterpaneel op categoriepagina's van de winkel. Standaard uitgeschakeld."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_LABEL="Filters"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_DESC="De filters in de getoonde volgorde. Bij een lege lijst: prijs en elk lijstveld (select, radio, checkbox) van de winkel. Binnen één filter volstaat elke gekozen optie (tenzij “Allemaal” is ingesteld); verschillende filters moeten allemaal overeenkomen."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_LABEL="Filteren op"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_DESC="Prijs: van–tot. Gridbox-veld: de opties van een lijstveld. Technische parameter: waarden met een eenheid uit de producttitel en -beschrijving (1000 V, 2,5 kV, CAT IV, IP67). Kenmerk: woorden in de beschrijving (bijv. Bluetooth). In de aanbieding / Op voorraad: één selectievakje."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_PRICE="Prijs"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_FIELD="Gridbox-veld"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_PARAM="Technische parameter (uit de beschrijving)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_FEATURE="Kenmerken (woorden in de beschrijving)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_SALE="In de aanbieding"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_STOCK="Op voorraad"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LABEL_LABEL="Titel"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LABEL_HINT="Automatisch"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_LABEL="Gridbox-veld"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_DESC="Een veld van de producten (Gridbox → Apps → de winkel → Velden). Tekstvelden tonen elke gebruikte tekst."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_SELECT="- Selecteer een veld -"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_DIM_LABEL="Parameter"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_DIM_DESC="Vink er een of meer aan. Elke aangevinkte parameter is op de site een eigen filter, alleen getoond in categorieën waarvan de producten die parameter hebben — zo kan één rij voor elke winkelpagina dienen (bijv. spanning en CAT voor meters, vochtigheid, druk en luchtsnelheid voor HVACR). Eenheden van één soort gelden als dezelfde waarde: 1 kV = 1000 V, 16 bar = 1.6 MPa, 2 l/min = 0.12 m³/h, 68 °F = 20 °C."
PLG_SYSTEM_BETTERCATEGORIES_DIM_V="Spanning (V)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_A="Stroom (A)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_W="Vermogen (W)"
