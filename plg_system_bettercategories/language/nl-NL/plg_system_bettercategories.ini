; 1.5.0 — product filters, reset
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS="Filters"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS_DESC="Productfilters op categoriepagina's van de winkel: prijs, lijstvelden van Gridbox, technische parameters uit de productbeschrijvingen en kenmerken die daarin voorkomen. De productlijst blijft die van Gridbox zelf — er worden alleen minder producten getoond."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ENABLED_LABEL="Productfilters"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ENABLED_DESC="Toon een filterpaneel op categoriepagina's van de winkel. Standaard uitgeschakeld."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_LABEL="Filters"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_DESC="De filters in de getoonde volgorde. Bij een lege lijst: prijs en elk lijstveld (select, radio, checkbox) van de winkel. Binnen één filter volstaat elke gekozen optie (tenzij “Allemaal” is ingesteld); verschillende filters moeten allemaal overeenkomen."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_LABEL="Filteren op"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_DESC="Prijs: van–tot. Gridbox-veld: de opties van een lijstveld. Technische parameter: waarden met een eenheid uit de producttitel en -beschrijving (1000 V, 2,5 kV, CAT IV, IP67). Kenmerk: woorden in de beschrijving (bijv. Bluetooth). In de aanbieding / Op voorraad: één selectievakje."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_PRICE="Prijs"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_FIELD="Gridbox-veld"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_PARAM="Technische parameter (uit de beschrijving)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_FEATURE="Kenmerken (woorden in de beschrijving)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_SALE="In de aanbieding"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_STOCK="Op voorraad"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LABEL_LABEL="Titel"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LABEL_HINT="Automatisch"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_LABEL="Gridbox-veld"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_DESC="Een veld van de producten (Gridbox → Apps → de winkel → Velden). Tekstvelden tonen elke gebruikte tekst, linkvelden (bijv. een fabrikant met een eigen pagina) de tekst van elke link. Zonder gekozen veld (of met een veld dat op deze site niet bestaat, bijv. uit een instellingenbestand) wordt het veld gebruikt waarvan de naam gelijk is aan de titel van het filter."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_SELECT="- Selecteer een veld -"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_DIM_LABEL="Parameter"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_DIM_DESC="Vink er een of meer aan. Elke aangevinkte parameter is op de site een eigen filter, alleen getoond in categorieën waarvan de producten die parameter hebben — zo kan één rij voor elke winkelpagina dienen (bijv. spanning en CAT voor meters, vochtigheid, druk en luchtsnelheid voor HVACR). Eenheden van één soort gelden als dezelfde waarde: 1 kV = 1000 V, 16 bar = 1.6 MPa, 2 l/min = 0.12 m³/h, 68 °F = 20 °C."
PLG_SYSTEM_BETTERCATEGORIES_DIM_V="Spanning (V)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_A="Stroom (A)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_W="Vermogen (W)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_VA="Schijnbaar vermogen (VA)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_HZ="Frequentie (Hz)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_OHM="Weerstand (Ω)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_F="Capaciteit (F)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_C="Temperatuur (°C, °F)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_DB="Geluidsniveau (dB)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_LX="Verlichtingssterkte (lx)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_PA="Druk (Pa, hPa, kPa, mbar, bar, psi)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_WH="Energie (Wh)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_AH="Accucapaciteit (Ah)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_M="Lengte (m)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_CAT="Meetcategorie (CAT)"
PLG_SYSTEM_BETTERCATEGORIES_DIM_IP="Beschermingsgraad (IP)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_LABEL="Tonen als"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_DESC="Waarden: een selectievakje voor elke gevonden waarde (600 V, 1000 V…). Bereik: velden “van–tot”."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_VALUES="Waarden"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_RANGE="Bereik (van–tot)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_LABEL="Waarde van een product"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_DESC="Een beschrijving noemt meestal meerdere waarden van één soort (een meter: 30 V waarschuwing, bereik 500 V, 1000 V). Hoogste: het product telt mee met zijn hoogste waarde (bijv. het meetbereik), laagste: met zijn laagste, elke: met elke gevonden waarde."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_MAX="Hoogste waarde"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_MIN="Laagste waarde"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_ANY="Elke gevonden waarde"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_LABEL="Kenmerken"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_DESC="Eén kenmerk per regel: <code>Naam = woord, ander woord</code>. Een product heeft het kenmerk als de titel of beschrijving een van de woorden bevat (hele woorden, hoofdletterongevoelig; spaties en koppeltekens gelden als gelijk). Een woord dat eindigt op <code>*</code> komt ook overeen met langere woorden, ook binnen een woordgroep: <code>ciąg* komin*</code> vindt “ciągu kominowego”. Een woordgroep met een komma staat tussen rechte aanhalingstekens: <code>&quot;CO 0-10,000ppm&quot;</code>. Sub- en superscript tellen als gewone tekens (O₂ = O2, m³ = m3). Zonder “=” wordt naar de naam zelf gezocht."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_HINT="True RMS = true rms, trms"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_LABEL="Meerdere opties gekozen"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_DESC="Een ervan: een product heeft een van de gekozen opties nodig. Allemaal: een product heeft elke gekozen optie nodig. Automatisch: “Allemaal” voor kenmerken, “Een ervan” voor de rest."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_AUTO="Automatisch"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_OR="Een ervan"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_AND="Allemaal"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_LABEL="Volgorde van de opties"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_AUTO="Zoals in Gridbox / de lijst"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_COUNT="Meeste producten eerst"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_ALPHA="Alfabetisch"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_LABEL="Naam in het adres"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_DESC="De filter verschijnt in het adres als <code>?f-name=…</code>. Leeg = afgeleid van de titel. Wijzig dit alleen voordat links naar gefilterde pagina's worden gedeeld."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_HINT="Uit de titel"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_COLLAPSED_LABEL="Eerst ingeklapt"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_LABEL="Positie van het paneel"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DESC="Zijbalk: een kolom naast de productlijst. Boven de producten: de filters op één rij, elke filter opent als menu. Knop: een knop “Filters” opent het paneel van opzij. Na het categorie-element: onder de categorieboom van Gridbox (vaak in de zijkolom van de pagina). Vóór / na een element: elk Gridbox-element op basis van zijn id. Ontbreekt het element, dan komt het paneel boven de producten. In de zijkolom: boven- of onderaan de kolom naast de productlijst (bijv. bij de categorieboom of de contactgegevens), automatisch gevonden."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_LEFT="Zijbalk links"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_RIGHT="Zijbalk rechts"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_TOP="Boven de producten (één rij)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DRAWER="Knop “Filters” (zijpaneel)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_AFTER_CATEGORIES="Na het categorie-element van Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_BEFORE_ITEM="Vóór een gekozen Gridbox-element"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_AFTER_ITEM="Na een gekozen Gridbox-element"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ITEM_ID_DESC="Het id-attribuut van een element in de opmaak van de winkelpagina (bijv. item-15003687280). U vindt het in de Gridbox-editor of in de paginabron."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_LABEL="Op telefoons"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_DESC="Knop: een knop “Filters” boven de producten opent het paneel van opzij (ook in smalle vensters). Zoals op computers: het paneel staat waar het op computers staat."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_DRAWER="Knop “Filters”"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_SAME="Zoals op computers"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_LABEL="Toepassen"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_DESC="Direct: elke wijziging toont meteen de producten (zonder de pagina te herladen). Met een knop: de bezoeker kiest en klikt daarna op “Toepassen”."
