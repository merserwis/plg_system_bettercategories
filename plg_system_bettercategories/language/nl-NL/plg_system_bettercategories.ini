PLG_SYSTEM_BETTERCATEGORIES_SITE_LABEL_GRID="Raster"
PLG_SYSTEM_BETTERCATEGORIES_SITE_LABEL_LIST="Lijst"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_FILTERS_MISSING="Overgeslagen — deze categorieën bestaan niet op deze site: %s."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_HIDE_COMMON_LABEL="Functies verbergen die elk product heeft"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_HIDE_COMMON_DESC="Een functie (woorden in de beschrijving) die elk product van de categorie heeft, beperkt niets — bijv. „Rapporten” in een categorie analysatoren die allemaal rapporten maken: zo'n optie wordt daar niet aangeboden (ze verschijnt waar maar enkele producten haar hebben)."

; Category description (1.7.0)
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_DESC="Categoriebeschrijving"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_DESC_DESC="De beschrijving van de categorie (Gridbox → de winkel → Categorieën → de categorie → Beschrijving) op haar pagina: waar de categorie-layout haar heeft of op een eigen plek, volledig of ingekort tot het begin met een knop."
PLG_SYSTEM_BETTERCATEGORIES_DESC_ENABLED_LABEL="Categoriebeschrijving"
PLG_SYSTEM_BETTERCATEGORIES_DESC_ENABLED_DESC="Toont de beschrijving van de categorie op haar pagina, en op de startpagina van de winkel die van de winkel. Gridbox vult zijn beschrijvingsblok alleen in de categoriekop; een blok dat elders in de categorie-layout staat, houdt de tekst „Category Description”. Met deze optie krijgt ook zo’n blok de beschrijving, of gaat de beschrijving naar de plek die hieronder is gekozen — altijd één keer op de pagina: de andere beschrijvingsblokken worden leeggemaakt. Ook in categorieën zonder subcategorieën. Overgenomen van MerTools (instelling Categoriepagina’s), dat dit niet meer doet."
PLG_SYSTEM_BETTERCATEGORIES_DESC_SEO_LABEL="Zoekmachines"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SEO_NOTE="De hele beschrijving staat in de HTML van de pagina zoals de server die stuurt, en maar één keer — verplaatst, niet gekopieerd. Inkorten beperkt alleen haar hoogte in de browser (geen <code>display:none</code>, niets wordt later geladen) en de knop is een <code>&lt;button&gt;</code>, geen link, dus hij voegt geen adres toe. Google leest en beoordeelt zulke tekst als elke andere (mobile-first-indexering). Zonder JavaScript wordt de hele tekst getoond."
PLG_SYSTEM_BETTERCATEGORIES_DESC_POSITION_LABEL="Positie op de pagina"
PLG_SYSTEM_BETTERCATEGORIES_DESC_POSITION_DESC="Waar de layout haar heeft: in het beschrijvingsblok van Gridbox — in de categoriekop, of waar het blok in de categorie-layout naartoe is verplaatst. De andere plekken zoals voor de subcategorieën; op dezelfde plek komt de beschrijving eerst. Staat het gekozen element niet op de pagina, dan gaat de beschrijving boven de producten."
PLG_SYSTEM_BETTERCATEGORIES_DESC_POSITION_LAYOUT="Waar de categorie-layout haar heeft"
PLG_SYSTEM_BETTERCATEGORIES_DESC_FIRST_PAGE_LABEL="Alleen op de eerste pagina"
PLG_SYSTEM_BETTERCATEGORIES_DESC_FIRST_PAGE_DESC="De volgende pagina’s van de productlijst (?page=2…) laten de beschrijving weg, zodat de pagina’s van één categorie niet dezelfde lange tekst herhalen (dubbele inhoud)."
PLG_SYSTEM_BETTERCATEGORIES_DESC_TIDY_LABEL="Witruimte opruimen"
PLG_SYSTEM_BETTERCATEGORIES_DESC_TIDY_DESC="Haalt weg wat de editor achterlaat: lege alinea’s (<code>&lt;p&gt;&amp;nbsp;&lt;/p&gt;</code>) en regeleinden aan het begin of einde van koppen en alinea’s, die grote gaten maken. Tekst, koppen, lijsten en links blijven zoals ze zijn."
PLG_SYSTEM_BETTERCATEGORIES_DESC_MARGIN_TOP_LABEL="Ruimte boven de beschrijving (px)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_MARGIN_BOTTOM_LABEL="Ruimte onder de beschrijving (px)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_FOLD_LABEL="Alleen het begin tonen"
PLG_SYSTEM_BETTERCATEGORIES_DESC_FOLD_DESC="Een lange beschrijving wordt getoond tot de hoogte hieronder, vervagend, met een knop die de rest opent (zoals op de fabrikantpagina’s). Een beschrijving die maar iets hoger is, wordt helemaal getoond, zonder knop."
PLG_SYSTEM_BETTERCATEGORIES_DESC_HEIGHT_LABEL="Hoogte van het begin (px)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_HEIGHT_DESC="Hoeveel van de beschrijving boven de knop te zien is; 180 px is ongeveer 6–7 regels tekst."
PLG_SYSTEM_BETTERCATEGORIES_DESC_HEIGHT_MOBILE_LABEL="Hoogte op telefoons (px)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_HEIGHT_MOBILE_DESC="Schermen tot 767 px breed. 0 = hetzelfde als hierboven."
PLG_SYSTEM_BETTERCATEGORIES_DESC_FADE_LABEL="Vervagen"
PLG_SYSTEM_BETTERCATEGORIES_DESC_FADE_DESC="De laatste regels van het begin vervagen, zodat duidelijk is dat de tekst verdergaat. Werkt op elke achtergrond, ook in de donkere modus."
PLG_SYSTEM_BETTERCATEGORIES_DESC_MORE_LABEL="Tekst van de knop"
PLG_SYSTEM_BETTERCATEGORIES_DESC_MORE_DESC="Leeg = in de taal van de site („Lees meer”, „Minder tonen”)."
PLG_SYSTEM_BETTERCATEGORIES_DESC_LESS_LABEL="Weer inklappen"
PLG_SYSTEM_BETTERCATEGORIES_DESC_LESS_DESC="Eenmaal open wordt de knop „Minder tonen” en klapt hij de beschrijving weer in (en scrolt ernaartoe als het begin buiten beeld is). Uit: de knop verdwijnt zodra de beschrijving open is."
PLG_SYSTEM_BETTERCATEGORIES_DESC_LESS_TEXT_LABEL="Tekst van de inklapknop"
PLG_SYSTEM_BETTERCATEGORIES_DESC_BUTTON_STYLE_LABEL="Stijl van de knop"
PLG_SYSTEM_BETTERCATEGORIES_DESC_BUTTON_FILLED="Gevuld (zoals op de fabrikantpagina’s)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_BUTTON_OUTLINE="Omlijnd"
PLG_SYSTEM_BETTERCATEGORIES_DESC_BUTTON_LINK="Tekstlink"
PLG_SYSTEM_BETTERCATEGORIES_DESC_BUTTON_ALIGN_LABEL="Uitlijning van de knop"
PLG_SYSTEM_BETTERCATEGORIES_DESC_BUTTON_BG_LABEL="Kleur van de knop"
PLG_SYSTEM_BETTERCATEGORIES_DESC_BUTTON_BG_DESC="Leeg = de accentkleur van het Gridbox-thema. De omlijnde knop en de tekstlink gebruiken haar voor hun tekst."
PLG_SYSTEM_BETTERCATEGORIES_DESC_BUTTON_COLOR_LABEL="Tekstkleur van de knop"
PLG_SYSTEM_BETTERCATEGORIES_DESC_BUTTON_COLOR_DESC="Van de gevulde knop (en van de omlijnde bij aanwijzen). Leeg = de tekstkleur van het thema op het accent."
PLG_SYSTEM_BETTERCATEGORIES_DESC_MORE_DEFAULT="Lees meer"
PLG_SYSTEM_BETTERCATEGORIES_DESC_LESS_DEFAULT="Minder tonen"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SCHEMA_LABEL="Gestructureerde gegevens: categoriebeschrijving"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SCHEMA_DESC="Voegt een schema.org CollectionPage toe: de naam van de categorie, haar beschrijving als platte tekst (tot 500 tekens) en het adres van de pagina — dezelfde tekst die bezoekers zien. Automatisch voegt haar alleen toe als de pagina geen eigen CollectionPage heeft (bijv. uit de SEO-instellingen van Gridbox), zodat er nooit twee zijn."
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_LABEL="Eigen inleiding"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_DESC="Splitst de beschrijving: het begin (een korte inleiding) gaat naar de plek hieronder — bijv. onder de categoriekop — en de rest naar de positie hierboven, bijv. onder de producten. Elk deel staat één keer op de pagina. Bij de lijn of markering: waar de beschrijving een horizontale lijn heeft of een alinea met alleen de markering (de editor van Gridbox heeft geen knop voor een lijn: typ de markering als eigen alinea); een beschrijving zonder wordt helemaal op de positie hierboven getoond. Na de eerste alinea: zonder bewerken — de eerste alinea (met de kop erboven) is de inleiding."
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_OFF="Nee (de hele beschrijving op één plek)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_MARKER="Bij een horizontale lijn of de markering"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_PARAGRAPH="Na de eerste alinea"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_MARKER_LABEL="Markering"
PLG_SYSTEM_BETTERCATEGORIES_DESC_SPLIT_MARKER_DESC="Tekst van een alinea die het einde van de inleiding aangeeft, bijv. --- of [meer]. De alinea zelf wordt niet getoond. Een horizontale lijn (&lt;hr&gt;) werkt altijd ook."
PLG_SYSTEM_BETTERCATEGORIES_DESC_LEAD_POSITION_LABEL="Positie van de inleiding"
PLG_SYSTEM_BETTERCATEGORIES_DESC_LEAD_POSITION_DESC="Waar het begin komt. Het wordt altijd helemaal getoond; alleen het begin tonen (hieronder) geldt voor de rest."
PLG_SYSTEM_BETTERCATEGORIES_DESC_LEAD_MARGIN_TOP_LABEL="Ruimte boven de inleiding (px)"
PLG_SYSTEM_BETTERCATEGORIES_DESC_LEAD_MARGIN_BOTTOM_LABEL="Ruimte onder de inleiding (px)"
PLG_SYSTEM_BETTERCATEGORIES_GB_ROWS_LABEL="Gridbox-element Categorieën: openen met een klik op de rij"
PLG_SYSTEM_BETTERCATEGORIES_GB_ROWS_DESC="In het Gridbox-element Categorieën (de categorieboom, vaak in een zijkolom) opent en sluit een categorie met subcategorieën die met een klik ergens op haar rij in plaats van naar haar pagina te gaan; de rij licht op bij aanwijzen. Op elke pagina met dat element. Overgenomen van MerTools (instelling Categoriepagina’s)."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_MERTOOLS_TAKEN="Better Categories for Gridbox heeft de categoriebeschrijvingen en de rijen van het element Categorieën overgenomen van MerTools (instelling Categoriepagina’s): zie de tabbladen Categoriebeschrijving en Navigatie en SEO."
