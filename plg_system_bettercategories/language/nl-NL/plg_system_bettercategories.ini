; 1.2.0 — navigation and SEO
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV="Navigatie en SEO"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV_DESC="Navigatie op het laatste niveau van de boom en gestructureerde gegevens voor zoekmachines."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_LABEL="Zustercategorieën op het laatste niveau"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_DESC="Een categorie zonder subcategorieën toont een balk met de categorieën ernaast (de huidige gemarkeerd) en een link terug naar de bovenliggende categorie, zodat klanten kunnen wisselen zonder terug te gaan. De producten eronder blijven ongewijzigd. Op telefoons scrolt de balk zijwaarts."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_LABEL="Kop van de balk"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_DESC="Leeg = geen kop."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_LABEL="Link terug naar de bovenliggende categorie"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_LABEL="Tekst van de terugkoppeling"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_DESC="%s wordt vervangen door de naam van de bovenliggende categorie (of van de winkel bij categorieën op het hoogste niveau)."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_LABEL="Gestructureerde gegevens: categorielijst"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_DESC="Voegt de getoonde categorieën toe als schema.org ItemList (JSON-LD) voor zoekmachines."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_LABEL="Gestructureerde gegevens: kruimelpad"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_DESC="Voegt een schema.org BreadcrumbList toe: winkel → bovenliggende categorieën → huidige categorie. Automatisch voegt die alleen toe als de pagina zelf geen kruimelpadgegevens heeft (bijvoorbeeld van een kruimelpadmodule), zodat er nooit twee zijn."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_AUTO="Automatisch"

; 1.3.0 — price "from", first row, tools
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_LABEL="Laagste prijs tonen"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_DESC="Toont onder elke categorie de laagste prijs van haar producten (inclusief subcategorieën): de actieprijs als die er is, ook winkelacties en productvarianten, in de valuta van de winkel. Producten zonder prijs worden overgeslagen."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_LABEL="Prijstekst"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_DESC="%s wordt vervangen door de prijs met valuta, bijv. “vanaf %s” of “vanaf %s excl. btw”."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_COLOR_LABEL="Prijskleur"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_LABEL="Eerste rij direct laden"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_DESC="Afbeeldingen van de eerste rij tegels (zoveel als er kolommen zijn op het apparaat van de bezoeker) laden direct met hoge prioriteit; de rest pas bij het scrollen. Versnelt het zichtbare deel van de pagina (LCP in PageSpeed)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_TITLE="Instellingenbestand"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_DESC="Sla de instellingen van dit formulier op in een bestand of laad ze uit een bestand (bijv. van een andere site). “Alleen stijlen” laat weg wat bij deze site hoort: winkel-ID's, element-ID's, categorieafbeeldingen en filters. “Standaardwaarden herstellen” zet de waarden van een nieuwe installatie terug."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_ALL="Alle instellingen exporteren"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_STYLES="Alleen stijlen exporteren"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT="Importeren uit bestand…"
