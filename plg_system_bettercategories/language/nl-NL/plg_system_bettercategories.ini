PLG_SYSTEM_BETTERCATEGORIES_FILTERS_HIDE_EMPTY_DESC="Opties die met de al gekozen filters geen producten zouden tonen, worden verborgen. Uit: ze blijven staan, grijs weergegeven."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MORE_LABEL="Eerst getoonde opties"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MORE_DESC="Meer opties van een filter staan achter “Meer tonen”. 0 = alle."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MIN_LABEL="Minimaal aantal producten"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MIN_DESC="Het paneel verschijnt in categorieën met minstens zoveel producten."
