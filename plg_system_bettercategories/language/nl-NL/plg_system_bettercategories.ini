PLG_SYSTEM_BETTERCATEGORIES_LIST_VIEW_LABEL="Schakelaar raster / lijst"
PLG_SYSTEM_BETTERCATEGORIES_LIST_VIEW_DESC="Twee knoppen aan het eind van de balk boven de producten: de producten als raster (zoals Gridbox ze toont) of als lijst — één per rij, de afbeelding links. De keuze onthoudt de browser van de bezoeker, de weergave wisselt meteen, zonder de pagina te laden. Ook in categorieën zonder filters."
PLG_SYSTEM_BETTERCATEGORIES_LIST_VIEW_DEFAULT_LABEL="Weergave bij start"
PLG_SYSTEM_BETTERCATEGORIES_LIST_VIEW_GRID="Raster"
PLG_SYSTEM_BETTERCATEGORIES_LIST_VIEW_LIST="Lijst"
PLG_SYSTEM_BETTERCATEGORIES_SHOW_ALL_LABEL="Knop „Alles tonen”"
PLG_SYSTEM_BETTERCATEGORIES_SHOW_ALL_DESC="Een link aan het eind van de balk boven de producten als de categorie meer producten heeft dan één pagina van de lijst: alle op één pagina (tot de grens hieronder), met de gekozen filters en sortering; „Per pagina tonen” gaat terug. Zo'n pagina wordt niet geïndexeerd."
PLG_SYSTEM_BETTERCATEGORIES_SHOW_ALL_MAX_LABEL="„Alles tonen”: hoogstens"
PLG_SYSTEM_BETTERCATEGORIES_SHOW_ALL_MAX_DESC="Producten op de pagina met alle (20–2000) — een pagina met duizenden producten zou te lang laden."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_TEXT_LABEL_ALL_LABEL="Alles tonen"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_TEXT_LABEL_PAGED_LABEL="Per pagina tonen"
PLG_SYSTEM_BETTERCATEGORIES_SITE_LABEL_ALL="Alles tonen (%d)"
