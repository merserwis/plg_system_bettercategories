PLG_SYSTEM_BETTERCATEGORIES_FILTERS_NOINDEX_DESC="Gefilterde lijsten krijgen <code>robots: noindex, follow</code>, zodat zoekmachines de categoriepagina zelf indexeren en niet elke combinatie van filters."
