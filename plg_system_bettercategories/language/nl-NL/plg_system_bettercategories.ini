PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_DESC="De filter verschijnt in het adres als <code>?f-name=…</code>. Leeg = afgeleid van de titel. Wijzig dit alleen voordat links naar gefilterde pagina's worden gedeeld."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_HINT="Uit de titel"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_COLLAPSED_LABEL="Eerst ingeklapt"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_LABEL="Positie van het paneel"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DESC="Zijbalk: een kolom naast de productlijst. Boven de producten: de filters op één rij, elke filter opent als menu. Knop: een knop “Filters” opent het paneel van opzij. Na het categorie-element: onder de categorieboom van Gridbox (vaak in de zijkolom van de pagina). Vóór / na een element: elk Gridbox-element op basis van zijn id. Ontbreekt het element, dan komt het paneel boven de producten. In de zijkolom: boven- of onderaan de kolom naast de productlijst (bijv. bij de categorieboom of de contactgegevens), automatisch gevonden."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_LEFT="Zijbalk links"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_RIGHT="Zijbalk rechts"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_TOP="Boven de producten (één rij)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DRAWER="Knop “Filters” (zijpaneel)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_AFTER_CATEGORIES="Na het categorie-element van Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_BEFORE_ITEM="Vóór een gekozen Gridbox-element"
