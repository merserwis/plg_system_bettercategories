PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_BUTTON="Met een knop “Toepassen”"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_COUNTS_LABEL="Aantal producten bij de opties"
