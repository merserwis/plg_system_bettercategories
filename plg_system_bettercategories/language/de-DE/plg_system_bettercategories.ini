PLG_SYSTEM_BETTERCATEGORIES_DIM_IP="Schutzart (IP)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_LABEL="Anzeigen als"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_DESC="Werte: ein Kontrollkästchen je gefundenem Wert (600 V, 1000 V…). Bereich: Felder „von–bis“."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_VALUES="Werte"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MODE_RANGE="Bereich (von–bis)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_LABEL="Wert eines Produkts"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_DESC="Eine Beschreibung nennt meist viele Werte einer Art (Messgerät: Warnung 30 V, 500 V, Bereich 1000 V). Höchster: das Produkt zählt mit seinem höchsten Wert (z. B. Messbereich), niedrigster: mit dem niedrigsten, beliebig: mit jedem gefundenen Wert."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_MAX="Höchster Wert"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_MIN="Niedrigster Wert"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_ANY="Jeder gefundene Wert"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_LABEL="Funktionen"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_DESC="Eine Funktion pro Zeile: <code>Name = Wort, anderes Wort</code>. Ein Produkt hat die Funktion, wenn Name oder Beschreibung eines der Wörter enthält (ganze Wörter, Groß-/Kleinschreibung egal; Leerzeichen und Bindestrich gleichwertig). Ein Wort mit <code>*</code> am Ende passt auch zu längeren Wörtern. Ohne „=“ wird der Name selbst gesucht."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_HINT="True RMS = true rms, trms"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_LABEL="Mehrere Optionen gewählt"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_DESC="Eine davon: ein Produkt braucht eine der gewählten Optionen. Alle: ein Produkt braucht jede gewählte Option. Automatisch: „alle“ bei Funktionen, „eine davon“ sonst."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_AUTO="Automatisch"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_OR="Eine davon"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_AND="Alle"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_LABEL="Reihenfolge der Optionen"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_AUTO="Wie in Gridbox / in der Liste"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_COUNT="Meiste Produkte zuerst"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_ALPHA="Alphabetisch"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_LABEL="Name in der Adresse"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_DESC="Der Filter erscheint in der Adresse als <code>?f-name=…</code>. Leer = aus dem Titel. Nur ändern, bevor Links auf gefilterte Seiten geteilt werden."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_HINT="Aus dem Titel"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_COLLAPSED_LABEL="Anfangs eingeklappt"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_LABEL="Position des Felds"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DESC="Seitenleiste: eine Spalte neben der Produktliste. Über den Produkten: die Filter in einer Reihe, jeder öffnet sich als Menü. Schaltfläche: „Filter“ öffnet das Feld von der Seite. Nach dem Kategorien-Element: unter dem Kategorienbaum von Gridbox (oft in der Seitenspalte). Vor / nach einem Element: ein beliebiges Gridbox-Element nach id. Fehlt das Element, steht das Feld über den Produkten."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_LEFT="Seitenleiste links"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_RIGHT="Seitenleiste rechts"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_TOP="Über den Produkten (eine Reihe)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DRAWER="Schaltfläche „Filter“ (Seitenfeld)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_AFTER_CATEGORIES="Nach dem Kategorien-Element von Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_BEFORE_ITEM="Vor einem gewählten Gridbox-Element"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_AFTER_ITEM="Nach einem gewählten Gridbox-Element"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ITEM_ID_DESC="Das id-Attribut eines Elements im Layout der Shopseite (z. B. item-15003687280). Zu finden im Gridbox-Editor oder im Seitenquelltext."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_LABEL="Auf Telefonen"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_DESC="Schaltfläche: „Filter“ über den Produkten öffnet das Feld von der Seite (auch in schmalen Fenstern). Wie am Computer: das Feld dort, wo es am Computer ist."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_DRAWER="Schaltfläche „Filter“"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_SAME="Wie am Computer"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_LABEL="Anwenden"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_DESC="Sofort: jede Änderung zeigt die Produkte gleich (ohne Neuladen der Seite). Mit Schaltfläche: der Besucher wählt und klickt dann „Anwenden“."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_AUTO="Sofort"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_BUTTON="Mit Schaltfläche „Anwenden“"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_COUNTS_LABEL="Anzahl der Produkte bei den Optionen"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_HIDE_EMPTY_LABEL="Optionen ohne Produkte ausblenden"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_HIDE_EMPTY_DESC="Optionen, die mit den bereits gewählten Filtern keine Produkte zeigen würden, werden ausgeblendet. Aus: sie bleiben ausgegraut."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MORE_LABEL="Zunächst sichtbare Optionen"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MORE_DESC="Weitere Optionen eines Filters stehen hinter „Mehr anzeigen“. 0 = alle."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MIN_LABEL="Mindestanzahl der Produkte"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MIN_DESC="Das Feld erscheint in Kategorien mit mindestens so vielen Produkten."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_NOINDEX_LABEL="Gefilterte Seiten: noindex"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_NOINDEX_DESC="Gefilterte Listen erhalten <code>robots: noindex, follow</code>, damit Suchmaschinen die Kategorieseite selbst indexieren und nicht jede Filterkombination."
