; 1.2.0 — Navigation und SEO
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV="Navigation und SEO"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV_DESC="Navigation auf der letzten Ebene des Baums und strukturierte Daten für Suchmaschinen."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_LABEL="Nachbarkategorien auf der letzten Ebene"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_DESC="Eine Kategorie ohne Unterkategorien zeigt eine Leiste mit den benachbarten Kategorien (die aktuelle hervorgehoben) und einen Link zurück zur übergeordneten Kategorie, sodass Kunden wechseln können, ohne zurückzugehen. Die Produkte darunter bleiben unverändert. Auf Smartphones lässt sich die Leiste seitlich scrollen."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_LABEL="Überschrift der Leiste"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_DESC="Leer = keine Überschrift."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_LABEL="Link zurück zur übergeordneten Kategorie"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_LABEL="Text des Zurück-Links"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_DESC="%s wird durch den Namen der übergeordneten Kategorie ersetzt (bzw. des Shops bei Kategorien der obersten Ebene)."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_LABEL="Strukturierte Daten: Kategorieliste"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_DESC="Fügt die aufgelisteten Kategorien als schema.org-ItemList (JSON-LD) für Suchmaschinen hinzu."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_LABEL="Strukturierte Daten: Breadcrumbs"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_DESC="Fügt eine schema.org-BreadcrumbList hinzu: Shop → übergeordnete Kategorien → aktuelle Kategorie. Automatisch fügt sie nur hinzu, wenn die Seite keine eigenen Breadcrumb-Daten hat (zum Beispiel aus einem Breadcrumbs-Modul), sodass es nie zwei gibt."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_AUTO="Automatisch"

; 1.3.0 — Preis „ab“, erste Zeile, Werkzeuge
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_LABEL="Niedrigsten Preis anzeigen"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_DESC="Zeigt unter jeder Kategorie den niedrigsten Preis ihrer Produkte (einschließlich Unterkategorien): den Angebotspreis, falls vorhanden, auch Shop-Aktionen und Produktvarianten, in der Shop-Währung. Produkte ohne Preis werden nicht berücksichtigt."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_LABEL="Preistext"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_DESC="%s wird durch den Preis mit Währung ersetzt, z. B. „ab %s“ oder „ab %s netto“."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_COLOR_LABEL="Preisfarbe"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_LABEL="Erste Zeile sofort laden"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_DESC="Die Bilder der ersten Kachelzeile (so viele wie Spalten auf dem Gerät des Besuchers) laden sofort mit hoher Priorität, die übrigen beim Scrollen. Beschleunigt den sichtbaren Teil der Seite (LCP in PageSpeed)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_TITLE="Einstellungsdatei"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_DESC="Die Einstellungen dieses Formulars in einer Datei speichern oder aus einer Datei laden (z. B. von einer anderen Website). „Nur Stile“ lässt weg, was zu dieser Website gehört: Shop-IDs, Element-IDs, Kategoriebilder und Filter. „Auf Standard zurücksetzen“ stellt die Werte einer frischen Installation wieder her."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_ALL="Alle Einstellungen exportieren"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_STYLES="Nur Stile exportieren"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT="Aus Datei importieren …"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_STYLES_ONLY="Nur Stile importieren (Shop-IDs, Element-IDs, Kategoriebilder und Filter dieser Website behalten)"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_CONFIRM="Die Einstellungen aus dieser Datei importieren und jetzt speichern? Nicht gespeicherte Änderungen in diesem Formular gehen verloren."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_READING="Import läuft …"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_DONE="%imported% Einstellungen importiert und gespeichert. Die Seite wird neu geladen …"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_DONE="Gespeichert als %name%."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_TITLE="Kleine Bilder"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DESC="Die kleinen Bilder aller Kategoriekacheln jetzt erstellen, damit kein Besucher darauf warten muss. Verwendet Breite und Qualität aus diesem Formular – speichern Sie auch die Einstellungen."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_GENERATE="Kleine Bilder jetzt erstellen"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEAR="Kleine Bilder löschen"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_RUNNING="In Arbeit … %ready% von %total% Bildern haben kleine Bilder."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DONE="Fertig: %ready% von %total% Bildern haben kleine Bilder (%skipped% verwenden das Original: extern, klein oder nicht lesbar)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEAR_CONFIRM="Alle kleinen Bilder löschen? Sie werden bei den nächsten Besuchen oder mit „Kleine Bilder jetzt erstellen“ neu erstellt."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEARED="%deleted% Dateien gelöscht."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_WORKING="In Arbeit …"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_FAILED="Fehlgeschlagen: "
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NOT_ALLOWED="Sie dürfen dieses Werkzeug nicht verwenden."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NOT_ALLOWED_EDIT="Sie dürfen die Plugin-Einstellungen nicht ändern."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NO_STORE="Keine Gridbox-Shop-App gefunden."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_GENERIC="Etwas ist schiefgelaufen. Die Details stehen im Joomla-Fehlerprotokoll (aktivieren Sie „System debuggen“, um sie hier zu sehen)."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_SIZE="Die Datei ist leer oder zu groß (max. 256 KB)."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_FILE="Dies ist keine Einstellungsdatei von Better Categories."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_EMPTY="Die Datei enthält keine Einstellungen dieses Plugins."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_THUMBS_OFF="Schnelle kleine Bilder sind deaktiviert."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NO_WEBP="PHP (GD) auf diesem Server kann keine WebP-Bilder schreiben."
PLG_SYSTEM_BETTERCATEGORIES_DIAGNOSTICS_LABEL="Diagnosekommentar"
PLG_SYSTEM_BETTERCATEGORIES_DIAGNOSTICS_DESC="Fügt Shop-Seiten einen HTML-Kommentar mit Plugin-Version, Einstellungs-Hash, Gerätetyp, Cache-Status und benötigter Zeit hinzu – nützlich, um zu vergleichen, was Desktop- und Smartphone-Besucher erhalten. Auf einer Live-Website deaktiviert lassen (bei aktiviertem „System debuggen“ von Joomla wird er immer hinzugefügt)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_HELP="Hilfe"

; 1.5.0 — product filters, reset
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS="Filter"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS_DESC="Produktfilter auf den Kategorieseiten des Shops: Preis, Listenfelder von Gridbox, technische Parameter aus den Produktbeschreibungen und darin gefundene Funktionen. Die Produktliste bleibt die von Gridbox — sie zeigt nur weniger Produkte."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ENABLED_LABEL="Produktfilter"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ENABLED_DESC="Ein Filterfeld auf den Kategorieseiten des Shops zeigen. Standardmäßig aus."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_LABEL="Filter"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_DESC="Die Filter in der angezeigten Reihenfolge. Leere Liste = Preis und jedes Listenfeld des Shops (Auswahl, Optionen, Kontrollkästchen). Innerhalb eines Filters genügt eine gewählte Option (außer bei „alle“); verschiedene Filter müssen alle zutreffen."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_LABEL="Filtern nach"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_DESC="Preis: von–bis. Gridbox-Feld: die Optionen eines Listenfelds. Technischer Parameter: Werte mit Einheit aus Produktname und Beschreibung (1000 V, 2,5 kV, CAT IV, IP67). Funktion: Wörter in der Beschreibung (z. B. Bluetooth). Angebot / Verfügbarkeit: ein Kontrollkästchen."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_PRICE="Preis"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_FIELD="Gridbox-Feld"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_PARAM="Technischer Parameter (aus der Beschreibung)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_FEATURE="Funktionen (Wörter in der Beschreibung)"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_SALE="Im Angebot"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_STOCK="Verfügbarkeit"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LABEL_LABEL="Titel"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LABEL_HINT="Automatisch"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_LABEL="Gridbox-Feld"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_DESC="Ein Feld der Produkte (Gridbox → Apps → der Shop → Felder). Textfelder listen jeden verwendeten Text."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FIELD_SELECT="- Feld wählen -"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_DIM_LABEL="Parameter"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_DIM_DESC="Die Art des Werts aus den Produkttexten, nach seiner Einheit. „1 kV“ und „1000 V“ sind derselbe Wert."
