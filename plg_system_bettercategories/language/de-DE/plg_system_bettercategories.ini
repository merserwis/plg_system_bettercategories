PLG_SYSTEM_BETTERCATEGORIES_THUMBS_LABEL="Schnelle kleine Bilder (WebP)"
PLG_SYSTEM_BETTERCATEGORIES_THUMBS_DESC="Kacheln laden kleine WebP-Kopien der Bilder statt der Fotos in voller Größe: eine in Kachelbreite und eine doppelt so breite für hochauflösende Bildschirme. Sie werden einmalig erstellt und in media/plg_system_bettercategories/thumbs gespeichert; ein geändertes Bild erhält neue. Externe Bilder, Bilder, die nicht größer als die Kachel sind, und Server ohne WebP-Unterstützung behalten das Originalbild."
