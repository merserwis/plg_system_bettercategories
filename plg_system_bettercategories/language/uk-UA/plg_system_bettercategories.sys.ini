PLG_SYSTEM_BETTERCATEGORIES="System - Better Categories for Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_XML_DESCRIPTION="Better Categories for Gridbox: на сторінках категорій магазину Gridbox (зокрема на головній сторінці магазину) показує підкатегорії поточної категорії з кількістю товарів — як текстові посилання або плитки із зображеннями. Список товарів, фільтри й пошук не змінюються. Joomla 6 / PHP 8.5."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_NO_GRIDBOX="Better Categories for Gridbox: Balbooa Gridbox (com_gridbox) не встановлено на цьому сайті, тож плагіну поки нічого робити."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_OLD_DISABLED="Better Categories for Gridbox: старіший плагін Gridbox Subcategories (plg_system_gbsubcats) вимкнено, щоб список не з’являвся двічі. Його можна видалити."
