PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV_DESC="Навігація на останньому рівні дерева та структуровані дані для пошукових систем."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_LABEL="Сусідні категорії на останньому рівні"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_DESC="Категорія без підкатегорій показує панель із сусідніми категоріями (поточну виділено) і посиланням назад до батьківської, щоб покупці могли перемикатися без повернення назад. Товари нижче не змінюються. На телефонах панель прокручується вбік."
