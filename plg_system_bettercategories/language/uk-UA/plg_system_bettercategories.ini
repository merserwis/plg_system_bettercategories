PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS_DESC="Фільтри товарів на сторінках категорій магазину: ціна, поля-списки Gridbox, технічні параметри, прочитані з описів товарів, і знайдені в них функції. Список товарів залишається списком Gridbox — лише показує менше товарів."
