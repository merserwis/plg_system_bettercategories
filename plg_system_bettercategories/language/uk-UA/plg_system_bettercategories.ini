PLG_SYSTEM_BETTERCATEGORIES_EAGER_DESC="Зображення першого рядка плиток (стільки, скільки стовпців на пристрої відвідувача) завантажуються одразу з високим пріоритетом, решта — під час прокручування до них. Пришвидшує видиму частину сторінки (LCP у PageSpeed)."
