; 1.2.0 — мініатюри
PLG_SYSTEM_BETTERCATEGORIES_THUMBS_LABEL="Швидкі мініатюри (WebP)"
PLG_SYSTEM_BETTERCATEGORIES_THUMBS_DESC="Плитки завантажують маленькі копії зображень у WebP замість повнорозмірних фото: одну завширшки з плитку й одну вдвічі ширшу для екранів високої чіткості. Вони створюються один раз і зберігаються в media/plg_system_bettercategories/thumbs; для зміненого зображення створюються нові. Зовнішні зображення, зображення не більші за плитку та сервери без підтримки WebP використовують оригінальне зображення."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_LABEL="Ширина мініатюри (px)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_DESC="Ширина меншої копії; більша вдвічі ширша. 480 підходить для 3–6 плиток у рядку."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_LABEL="Якість мініатюр (40–95)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_DESC="Якість WebP. При 80 мініатюра виглядає як оригінал, а важить у рази менше."

; 1.2.0 — за рівнями
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS="За рівнями"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS_DESC="Різні налаштування для різних рівнів дерева категорій, наприклад великі плитки із зображеннями на головній сторінці магазину й компактні текстові посилання глибше. Кожне порожнє поле зберігає основне налаштування. Виберіть категорію в попередньому перегляді наживо, щоб побачити її рівень."
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_LABEL="Налаштування рівнів"
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_DESC="Один рядок на рівень. Якщо для рівня є кілька рядків, застосовується перший."
