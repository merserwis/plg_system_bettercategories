; 1.3.0 — ціна «від», перший рядок, інструменти
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_LABEL="Показувати найнижчу ціну"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_DESC="Показує під кожною категорією найнижчу ціну її товарів (включно з підкатегоріями): ціну зі знижкою, якщо вона є, також з урахуванням розпродажів магазину та варіантів товарів, у валюті магазину. Товари без ціни не враховуються."
