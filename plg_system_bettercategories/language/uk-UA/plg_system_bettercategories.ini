PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_DESC="Зберегти налаштування цієї форми у файл або завантажити їх із файлу (наприклад, з іншого сайту). «Лише стилі» пропускає те, що належить цьому сайту: ID магазинів, ID елементів, зображення категорій і фільтри. «Скинути до типових» повертає значення свіжого встановлення."
