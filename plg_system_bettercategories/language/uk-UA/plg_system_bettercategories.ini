PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DESC="Створити мініатюри для всіх плиток категорій зараз, щоб жоден відвідувач на них не чекав. Використовує ширину та якість із цієї форми — збережіть також налаштування."
