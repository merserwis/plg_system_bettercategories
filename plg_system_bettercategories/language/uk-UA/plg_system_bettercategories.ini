PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_DESC="Фільтри в порядку показу. Порожній список = ціна та кожне поле-список магазину (список, перемикачі, прапорці). В одному фільтрі достатньо будь-якої позначеної опції (якщо не вибрано «усі»); різні фільтри мають виконуватися одночасно."
