PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DESC="Бічна панель: колонка поруч зі списком товарів. Над товарами: фільтри в один ряд, кожен відкривається як меню. Кнопка: кнопка «Фільтри» висуває панель збоку. Після елемента категорій: під деревом категорій Gridbox (часто в бічній колонці сторінки). Перед / після елемента: будь-який елемент Gridbox за його id. Якщо елемента немає, панель стає над товарами. У бічній колонці: вгорі або внизу колонки поруч зі списком товарів (напр. з деревом категорій або контактами), знаходиться автоматично."
