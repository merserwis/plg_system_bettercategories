PLG_SYSTEM_BETTERCATEGORIES_SUB_MODE_DESC="Як кожна категорія показує власні підкатегорії. Висувна панель: відкривається знизу й зсуває макет донизу. Бічна панель: висувається поверх плитки. Перевертання картки: плитка перевертається, а на звороті — список підкатегорій. Підказка: маленька бульбашка над категорією. Бічна панель і перевертання картки потребують плиток; з текстовими посиланнями вони працюють як висувна панель. На сенсорних екранах і для користувачів клавіатури панель відкриває маленька кнопка +."
