PLG_SYSTEM_BETTERCATEGORIES="Sistema - Better Categories for Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_XML_DESCRIPTION="Better Categories for Gridbox: en las páginas de categoría de la tienda Gridbox (incluida la página de inicio de la tienda) muestra las subcategorías de la categoría actual con el número de productos, como enlaces de texto o mosaicos con imagen. La lista de productos, los filtros y la búsqueda no cambian. Joomla 6 / PHP 8.5."
