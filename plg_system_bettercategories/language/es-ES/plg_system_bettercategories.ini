PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DESC="Cree ahora las imágenes pequeñas de todos los mosaicos de categorías para que ningún visitante tenga que esperarlas. Usa el ancho y la calidad de este formulario: guarde también la configuración."
