PLG_SYSTEM_BETTERCATEGORIES_DIAGNOSTICS_DESC="Añade a las páginas de la tienda un comentario HTML con la versión del plugin, el hash de la configuración, el tipo de dispositivo, el estado de la caché y el tiempo empleado; útil para comparar lo que reciben los visitantes de escritorio y de móvil. Déjelo desactivado en un sitio en producción (siempre se añade con Depurar el sistema de Joomla activado)."
