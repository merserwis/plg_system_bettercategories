; 1.2.0 — navegación y SEO
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV="Navegación y SEO"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV_DESC="Navegación en el último nivel del árbol y datos estructurados para los buscadores."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_LABEL="Categorías hermanas en el último nivel"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_DESC="Una categoría sin subcategorías muestra una barra con las categorías vecinas (la actual resaltada) y un enlace de vuelta a la categoría superior, para que los clientes cambien sin retroceder. Los productos de abajo no cambian. En móviles la barra se desplaza lateralmente."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_LABEL="Encabezado de la barra"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_DESC="Vacío = sin encabezado."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_LABEL="Enlace de vuelta a la categoría superior"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_LABEL="Texto del enlace de vuelta"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_DESC="%s se sustituye por el nombre de la categoría superior (o de la tienda en las categorías de primer nivel)."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_LABEL="Datos estructurados: lista de categorías"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_DESC="Añade las categorías mostradas como ItemList de schema.org (JSON-LD) para los buscadores."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_LABEL="Datos estructurados: ruta de navegación"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_DESC="Añade un BreadcrumbList de schema.org: tienda → categorías superiores → categoría actual. Automático lo añade solo si la página no tiene datos de ruta de navegación propios (p. ej. de un módulo de ruta de navegación), para que nunca haya dos."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_AUTO="Automático"

; 1.3.0 — precio «desde», primera fila, herramientas
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_LABEL="Mostrar el precio más bajo"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_DESC="Muestra bajo cada categoría el precio más bajo de sus productos (incluidas las subcategorías): el precio rebajado cuando lo hay, también las rebajas de la tienda y las variaciones de producto, en la moneda de la tienda. Los productos sin precio no se tienen en cuenta."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_LABEL="Texto del precio"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_DESC="%s se sustituye por el precio con la moneda, p. ej. «desde %s» o «desde %s sin IVA»."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_COLOR_LABEL="Color del precio"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_LABEL="Cargar la primera fila de inmediato"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_DESC="Las imágenes de la primera fila de mosaicos (tantas como columnas en el dispositivo del visitante) se cargan de inmediato con prioridad alta; el resto al desplazarse hasta ellas. Acelera la parte visible de la página (LCP en PageSpeed)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_TITLE="Archivo de configuración"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_DESC="Guarde la configuración de este formulario en un archivo o cárguela desde un archivo (p. ej. de otro sitio). «Solo estilos» omite lo que pertenece a este sitio: ID de tiendas, ID de elemento e imágenes de categorías."
