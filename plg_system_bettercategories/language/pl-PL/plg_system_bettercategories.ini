PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_DESC="Przycisk: przycisk „Filtry” nad produktami wysuwa panel z boku (także w wąskich oknach). Jak na komputerze: panel tam, gdzie na komputerze."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_DRAWER="Przycisk „Filtry”"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_MOBILE_SAME="Jak na komputerze"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_LABEL="Zastosowanie"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_APPLY_DESC="Od razu: każda zmiana od razu pokazuje produkty (bez przeładowania strony). Przyciskiem: odwiedzający wybiera, potem klika „Zastosuj”."
