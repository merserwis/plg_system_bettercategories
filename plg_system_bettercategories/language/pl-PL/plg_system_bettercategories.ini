PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_COUNT="Najwięcej produktów najpierw"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_SORT_ALPHA="Alfabetycznie"
