PLG_SYSTEM_BETTERCATEGORIES_THUMBS_DESC="Kafelki ładują małe kopie WebP obrazów zamiast zdjęć w pełnym rozmiarze: jedną o szerokości kafelka i jedną dwa razy szerszą dla ostrych ekranów. Są tworzone raz i przechowywane w media/plg_system_bettercategories/thumbs; zmieniony obraz dostaje nowe. Obrazy zewnętrzne, obrazy nie większe niż kafelek oraz serwery bez obsługi WebP używają oryginalnego obrazu."
