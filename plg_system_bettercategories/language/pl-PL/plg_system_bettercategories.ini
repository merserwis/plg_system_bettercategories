PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEAR_CONFIRM="Usunąć wszystkie miniatury? Zostaną utworzone ponownie przy kolejnych odwiedzinach lub przyciskiem „Utwórz miniatury teraz”."
