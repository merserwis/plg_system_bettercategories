PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ENABLED_DESC="Pokaż panel filtrów na stronach kategorii sklepu. Domyślnie wyłączone."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_LABEL="Filtry"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_LIST_DESC="Filtry w kolejności wyświetlania. Pusta lista = cena i każde pole listy sklepu (lista, opcje, pola wyboru). W jednym filtrze wystarczy dowolna zaznaczona opcja (chyba że ustawiono „wszystkie”); różne filtry muszą być spełnione jednocześnie."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_LABEL="Filtruj według"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_TYPE_DESC="Cena: od–do. Pole Gridboxa: opcje pola listy. Parametr techniczny: wartości z jednostką odczytane z nazwy i opisu produktu (1000 V, 2,5 kV, CAT IV, IP67). Funkcja: słowa znalezione w opisie (np. Bluetooth). Promocja / Dostępność: jedno pole wyboru."
