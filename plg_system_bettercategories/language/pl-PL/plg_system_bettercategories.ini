PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_DESC="Jedna funkcja w wierszu: <code>Nazwa = słowo, inne słowo</code>. Produkt ma funkcję, gdy jego nazwa lub opis zawiera jedno ze słów (całe słowa, wielkość liter bez znaczenia; spacja i łącznik są równoważne). Słowo zakończone <code>*</code> pasuje też do dłuższych słów. Bez „=” szukana jest sama nazwa."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_FEATURES_HINT="True RMS = true rms, trms"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_LABEL="Kilka zaznaczonych opcji"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_DESC="Dowolna: produkt musi mieć jedną z zaznaczonych opcji. Wszystkie: produkt musi mieć każdą zaznaczoną. Automatycznie: „wszystkie” dla funkcji, „dowolna” dla pozostałych."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_AUTO="Automatycznie"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_OR="Dowolna z nich"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_LOGIC_AND="Wszystkie"
