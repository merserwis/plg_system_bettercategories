PLG_SYSTEM_BETTERCATEGORIES_FILTER_MATCH_DESC="Opis zwykle podaje wiele wartości jednego rodzaju (miernik: ostrzeżenie 30 V, 500 V, zakres 1000 V). Najwyższa: produkt liczy się swoją najwyższą wartością (np. zakresem pomiarowym), najniższa: najniższą, dowolna: każdą znalezioną."
