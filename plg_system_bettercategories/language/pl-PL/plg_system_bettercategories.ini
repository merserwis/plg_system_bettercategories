PLG_SYSTEM_BETTERCATEGORIES_THUMBS_DESC="Kafelki ładują małe kopie WebP obrazów zamiast zdjęć w pełnym rozmiarze: jedną o szerokości kafelka i jedną dwa razy szerszą dla ostrych ekranów. Są tworzone raz i przechowywane w media/plg_system_bettercategories/thumbs; zmieniony obraz dostaje nowe. Obrazy zewnętrzne, obrazy nie większe niż kafelek oraz serwery bez obsługi WebP używają oryginalnego obrazu."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_LABEL="Szerokość miniatury (px)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_WIDTH_DESC="Szerokość mniejszej kopii; większa jest dwa razy szersza. 480 pasuje do 3–6 kafelków w wierszu."
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_LABEL="Jakość miniatur (40–95)"
PLG_SYSTEM_BETTERCATEGORIES_THUMB_QUALITY_DESC="Jakość WebP. Przy 80 obraz wygląda jak oryginał, a waży ułamek jego rozmiaru."

; 1.2.0 — ustawienia poziomów
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS="Poziomy"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_LEVELS_DESC="Różne ustawienia dla różnych poziomów drzewa kategorii, np. duże kafelki z obrazami na stronie głównej sklepu i zwarte linki tekstowe głębiej. Każde puste pole zachowuje ustawienie główne. Wybierz kategorię w podglądzie na żywo, aby zobaczyć jej poziom."
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_LABEL="Ustawienia poziomów"
PLG_SYSTEM_BETTERCATEGORIES_LEVELS_DESC="Jeden wiersz na poziom. Jeśli poziom ma kilka wierszy, obowiązuje pierwszy."
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_LABEL="Poziom"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_0="Strona główna sklepu"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_1="Poziom 1 — kategoria główna"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_2="Poziom 2 — jej podkategoria"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_3="Poziom 3 i głębsze"
PLG_SYSTEM_BETTERCATEGORIES_LEVEL_INHERIT="— ustawienie główne —"

; 1.2.0 — nawigacja i SEO
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV="Nawigacja i SEO"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_NAV_DESC="Nawigacja na ostatnim poziomie drzewa i dane strukturalne dla wyszukiwarek internetowych."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_LABEL="Sąsiednie kategorie na ostatnim poziomie"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_SIBLINGS_DESC="Kategoria bez podkategorii pokazuje pasek z kategoriami obok niej (bieżąca jest wyróżniona) i link powrotu do kategorii nadrzędnej, aby kupujący mogli przechodzić między nimi bez cofania się. Produkty poniżej pozostają bez zmian. Na telefonach pasek przewija się w bok."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_LABEL="Nagłówek paska"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_HEADING_DESC="Puste = bez nagłówka."
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_LABEL="Link powrotu do kategorii nadrzędnej"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_LABEL="Tekst linku powrotu"
PLG_SYSTEM_BETTERCATEGORIES_LEAF_BACK_TEXT_DESC="%s jest zastępowane nazwą kategorii nadrzędnej (lub sklepu w kategoriach najwyższego poziomu)."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_LABEL="Dane strukturalne: lista kategorii"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_LIST_DESC="Dodaje pokazane kategorie jako schema.org ItemList (JSON-LD) dla wyszukiwarek internetowych."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_LABEL="Dane strukturalne: ścieżka nawigacji"
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_DESC="Dodaje schema.org BreadcrumbList: sklep → kategorie nadrzędne → bieżąca kategoria. Automatycznie dodaje ją tylko wtedy, gdy strona nie ma własnych danych ścieżki nawigacji (np. z modułu ścieżki nawigacji), więc nigdy nie ma ich dwóch."
PLG_SYSTEM_BETTERCATEGORIES_SCHEMA_CRUMBS_AUTO="Automatycznie"

; 1.3.0 — cena „od”, pierwszy wiersz, narzędzia
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_LABEL="Pokaż najniższą cenę"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_DESC="Pokazuje pod każdą kategorią najniższą cenę jej produktów (łącznie z podkategoriami): cenę promocyjną, jeśli jest, także z promocji sklepu i wariantów produktów, w walucie sklepu. Produkty bez ceny są pomijane."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_LABEL="Tekst ceny"
PLG_SYSTEM_BETTERCATEGORIES_PRICE_FROM_TEXT_DESC="%s jest zastępowane ceną z walutą, np. „od %s” lub „od %s netto”."
PLG_SYSTEM_BETTERCATEGORIES_PRICE_COLOR_LABEL="Kolor ceny"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_LABEL="Ładuj pierwszy wiersz od razu"
PLG_SYSTEM_BETTERCATEGORIES_EAGER_DESC="Obrazy pierwszego wiersza kafelków (tyle, ile kolumn na urządzeniu odwiedzającego) ładują się od razu z wysokim priorytetem; pozostałe po przewinięciu do nich. Przyspiesza widoczną część strony (LCP w PageSpeed)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_TITLE="Plik ustawień"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_SETTINGS_DESC="Zapisz ustawienia z tego formularza do pliku lub wczytaj je z pliku (np. z innej witryny). „Tylko style” pomija to, co należy do tej witryny: ID sklepów, ID elementu i obrazy kategorii."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_ALL="Eksportuj wszystkie ustawienia"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_STYLES="Eksportuj tylko style"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT="Importuj z pliku…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_STYLES_ONLY="Importuj tylko style (zachowaj ID sklepów, ID elementu i obrazy kategorii tej witryny)"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_CONFIRM="Zaimportować ustawienia z tego pliku i od razu je zapisać? Niezapisane zmiany w tym formularzu zostaną utracone."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_READING="Importowanie…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_IMPORT_DONE="Zaimportowano i zapisano ustawienia: %imported%. Przeładowywanie strony…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_EXPORT_DONE="Zapisano jako %name%."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_TITLE="Miniatury"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DESC="Utwórz teraz miniatury wszystkich kafelków kategorii, aby żaden odwiedzający na nie nie czekał. Używa szerokości i jakości z tego formularza — zapisz też ustawienia."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_GENERATE="Utwórz miniatury teraz"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEAR="Usuń miniatury"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_RUNNING="Trwa praca… Miniatury ma %ready% z %total% obrazów."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_DONE="Gotowe: miniatury ma %ready% z %total% obrazów (%skipped% używa oryginału: zewnętrzne, małe lub nieczytelne)."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEAR_CONFIRM="Usunąć wszystkie miniatury? Zostaną utworzone ponownie przy kolejnych odwiedzinach lub przyciskiem „Utwórz miniatury teraz”."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_THUMBS_CLEARED="Usunięte pliki: %deleted%."
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_WORKING="Trwa praca…"
PLG_SYSTEM_BETTERCATEGORIES_TOOLS_FAILED="Błąd: "
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NOT_ALLOWED="Nie masz uprawnień do używania tego narzędzia."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NOT_ALLOWED_EDIT="Nie masz uprawnień do zmiany ustawień wtyczki."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NO_STORE="Nie znaleziono aplikacji sklepu Gridbox."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_GENERIC="Coś poszło nie tak. Szczegóły są w dzienniku błędów Joomla (włącz Debugowanie systemu, aby zobaczyć je tutaj)."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_SIZE="Plik jest pusty lub za duży (maks. 256 KB)."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_FILE="To nie jest plik ustawień Better Categories."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_IMPORT_EMPTY="Plik nie zawiera ustawień tej wtyczki."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_THUMBS_OFF="Szybkie miniatury są wyłączone."
PLG_SYSTEM_BETTERCATEGORIES_ERROR_NO_WEBP="PHP (GD) na tym serwerze nie potrafi zapisywać obrazów WebP."
PLG_SYSTEM_BETTERCATEGORIES_DIAGNOSTICS_LABEL="Komentarz diagnostyczny"
PLG_SYSTEM_BETTERCATEGORIES_DIAGNOSTICS_DESC="Dodaje do stron sklepu komentarz HTML z wersją wtyczki, skrótem ustawień, typem urządzenia, stanem pamięci podręcznej i czasem pracy — przydatne do porównania, co dostają odwiedzający na komputerach i telefonach. Na działającej witrynie pozostaw wyłączone (komentarz jest zawsze dodawany przy włączonym Debugowaniu systemu Joomla)."
