PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DESC="Pasek boczny: kolumna obok listy produktów. Nad produktami: filtry w jednym rzędzie, każdy otwiera się jak menu. Przycisk: przycisk „Filtry” wysuwa panel z boku. Za elementem kategorii: pod drzewem kategorii Gridboxa (często w bocznej kolumnie strony). Przed / za elementem: dowolny element Gridboxa po jego id. Gdy elementu brak, panel trafia nad produkty. W bocznej kolumnie: na górze lub na dole kolumny obok listy produktów (np. z drzewem kategorii lub opiekunami), wykrywanej automatycznie."
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_LEFT="Pasek boczny z lewej"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_SIDEBAR_RIGHT="Pasek boczny z prawej"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_TOP="Nad produktami (w rzędzie)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_DRAWER="Przycisk „Filtry” (panel z boku)"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_AFTER_CATEGORIES="Za elementem kategorii Gridboxa"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_BEFORE_ITEM="Przed wybranym elementem Gridboxa"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_POSITION_AFTER_ITEM="Za wybranym elementem Gridboxa"
PLG_SYSTEM_BETTERCATEGORIES_FILTERS_ITEM_ID_DESC="Atrybut id elementu w układzie strony sklepu (np. item-15003687280). Znajdziesz go w edytorze Gridboxa lub w źródle strony."
