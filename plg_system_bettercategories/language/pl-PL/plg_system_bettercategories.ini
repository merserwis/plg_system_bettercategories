PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_DESC="Filtr pojawia się w adresie jako <code>?f-nazwa=…</code>. Puste = z tytułu. Zmieniaj tylko zanim linki do przefiltrowanych stron zostaną udostępnione."
PLG_SYSTEM_BETTERCATEGORIES_FILTER_KEY_HINT="Z tytułu"
PLG_SYSTEM_BETTERCATEGORIES_FILTER_COLLAPSED_LABEL="Początkowo zwinięty"
