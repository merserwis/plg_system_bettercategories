; 1.5.0 — product filters, reset
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS="Filtry"
PLG_SYSTEM_BETTERCATEGORIES_FIELDSET_FILTERS_DESC="Filtry produktów na stronach kategorii sklepu: cena, pola list Gridboxa, parametry techniczne odczytane z opisów produktów i znalezione w nich funkcje. Lista produktów pozostaje listą Gridboxa — pokazuje tylko mniej produktów."
