PLG_SYSTEM_BETTERCATEGORIES="System - Better Categories for Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_XML_DESCRIPTION="Better Categories for Gridbox: na stronach kategorii sklepu Gridbox (także na stronie głównej sklepu) pokazuje podkategorie bieżącej kategorii z liczbą produktów, jako linki tekstowe lub kafelki z obrazami. Lista produktów, filtry i wyszukiwanie pozostają bez zmian. Joomla 6 / PHP 8.5."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_NO_GRIDBOX="Better Categories for Gridbox: Balbooa Gridbox (com_gridbox) nie jest zainstalowany w tej witrynie, więc wtyczka nie ma jeszcze nic do zrobienia."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_OLD_DISABLED="Better Categories for Gridbox: starsza wtyczka Gridbox Subcategories (plg_system_gbsubcats) została wyłączona, aby lista nie pojawiała się dwa razy. Możesz ją odinstalować."
