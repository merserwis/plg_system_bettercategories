PLG_SYSTEM_BETTERCATEGORIES="System - Better Categories for Gridbox"
PLG_SYSTEM_BETTERCATEGORIES_XML_DESCRIPTION="Better Categories for Gridbox: on Gridbox store category pages (including the store home page) shows the subcategories of the current category with product counts, as text links or image tiles. The product list, filters and search are unchanged. Joomla 6 / PHP 8.5."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_NO_GRIDBOX="Better Categories for Gridbox: Balbooa Gridbox (com_gridbox) is not installed on this site, so the plugin has nothing to do yet."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_OLD_DISABLED="Better Categories for Gridbox: the older Gridbox Subcategories plugin (plg_system_gbsubcats) was switched off, so the list does not appear twice. You can uninstall it."
PLG_SYSTEM_BETTERCATEGORIES_INSTALL_MERTOOLS_TAKEN="Better Categories for Gridbox took over the category descriptions and the rows of the Categories element from MerTools (setting Category pages): see the tabs Category description and Navigation and SEO."
