MOD_BETTERCATEGORIES="Better Categories for Gridbox"
MOD_BETTERCATEGORIES_XML_DESCRIPTION="La liste Better Categories d'une catégorie de boutique Gridbox (ou de l'accueil de la boutique) dans n'importe quelle position de module ou dans un élément Gridbox « Module Joomla ». Utilise les styles du plugin Better Categories, qui doit être activé."
MOD_BETTERCATEGORIES_INFO="Affiche les sous-catégories de la catégorie choisie avec les styles définis dans le plugin Better Categories (Composants → Better Categories for Gridbox). Les champs laissés sur « paramètre du plugin » conservent la valeur du plugin. Dans Gridbox, ajoutez-le avec l'élément « Module Joomla ». Le module ne masque jamais les produits et n'ajoute aucune donnée structurée."
