MOD_BETTERCATEGORIES_MENU_TRIGGER_LABEL="Ouverture"
MOD_BETTERCATEGORIES_MENU_TRIGGER_DESC="Sur un ordinateur : au survol du pointeur ou seulement au clic. Sur les écrans tactiles toujours au toucher."
MOD_BETTERCATEGORIES_MENU_TRIGGER_HOVER="Au survol"
MOD_BETTERCATEGORIES_MENU_TRIGGER_CLICK="Au clic"
MOD_BETTERCATEGORIES_MENU_DEPTH_LABEL="Niveaux"
MOD_BETTERCATEGORIES_MENU_DEPTH_DESC="2 : les catégories principales et leurs sous-catégories. 3 : aussi les catégories sous les sous-catégories, en liens en dessous."
MOD_BETTERCATEGORIES_MENU_LEAVES_LABEL="Liens sous une sous-catégorie"
MOD_BETTERCATEGORIES_MENU_LEAVES_DESC="Au plus autant, puis « Plus… » (vers la sous-catégorie). 0 = tous."
