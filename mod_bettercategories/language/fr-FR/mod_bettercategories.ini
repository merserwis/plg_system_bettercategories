MOD_BETTERCATEGORIES_MENU_IMAGES_LABEL="Images"
MOD_BETTERCATEGORIES_MENU_IMAGES_DESC="Les images des catégories comme dans la liste (image propre, image Gridbox, produit le plus vu), en petites copies."
