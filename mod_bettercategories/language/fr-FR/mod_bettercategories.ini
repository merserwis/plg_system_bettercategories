; 1.11.0: store menu
MOD_BETTERCATEGORIES_KIND_LABEL="Afficher comme"
MOD_BETTERCATEGORIES_KIND_DESC="Une liste des sous-catégories d'une catégorie (comme sur les pages de la boutique) ou le menu de la boutique : l'arbre des catégories pour l'en-tête du site, sur trois niveaux."
MOD_BETTERCATEGORIES_KIND_LIST="Liste des sous-catégories"
MOD_BETTERCATEGORIES_KIND_MENU="Menu de la boutique (méga-menu)"
MOD_BETTERCATEGORIES_MENU_NOTE="Le menu de la boutique montre les catégories sous celle choisie (accueil de la boutique : les catégories principales), leurs sous-catégories avec une image, le nombre de produits et le prix « à partir de », et les catégories en dessous. À partir de 1024 px un panneau ou une barre ; sur téléphones et tablettes un tiroir latéral. Placez-le dans l'en-tête avec l'élément Gridbox « Joomla Module », ou dans le menu déroulant d'un élément du menu Gridbox (Mega Menu) avec le type « Panneau ouvert »."
MOD_BETTERCATEGORIES_MENU_STYLE_LABEL="Type"
MOD_BETTERCATEGORIES_MENU_STYLE_DESC="Bouton : un bouton ouvre un panneau avec les catégories principales à gauche et les sous-catégories de celle pointée à droite. Barre : les catégories principales sur une ligne, chacune ouvre ses sous-catégories sous la barre. Panneau ouvert : le panneau toujours affiché (pour le menu déroulant du menu Gridbox)."
MOD_BETTERCATEGORIES_MENU_STYLE_BUTTON="Bouton avec panneau"
MOD_BETTERCATEGORIES_MENU_STYLE_BAR="Barre des catégories principales"
MOD_BETTERCATEGORIES_MENU_STYLE_PANEL="Panneau ouvert"
