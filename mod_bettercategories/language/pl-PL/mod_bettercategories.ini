MOD_BETTERCATEGORIES_XML_DESCRIPTION="Lista Better Categories dla kategorii sklepu Gridbox (lub strony głównej sklepu) w dowolnej pozycji modułów albo w elemencie Gridbox „Joomla Module”. Używa stylów wtyczki Better Categories, która musi być włączona."
MOD_BETTERCATEGORIES_INFO="Pokazuje podkategorie wybranej kategorii ze stylami ustawionymi we wtyczce Better Categories (Komponenty → Better Categories for Gridbox). Pola pozostawione na „ustawienie wtyczki” zachowują wartość z wtyczki. W Gridbox dodaj moduł elementem „Joomla Module”. Moduł nigdy nie ukrywa produktów i nie dodaje danych strukturalnych."
