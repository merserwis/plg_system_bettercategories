MOD_BETTERCATEGORIES_KIND_LABEL="Pokaż jako"
MOD_BETTERCATEGORIES_KIND_DESC="Lista podkategorii jednej kategorii (jak na stronach sklepu) albo menu sklepu, czyli drzewo kategorii do nagłówka strony, do trzech poziomów w głąb."
