MOD_BETTERCATEGORIES_MENU_NOTE="Menu sklepu pokazuje kategorie pod wybraną (dla strony głównej sklepu: kategorie główne), ich podkategorie z obrazem, liczbą produktów i ceną „od” oraz kategorie pod nimi. Od 1024 px wyświetla się jako panel albo pasek, na telefonach i tabletach jako szuflada wysuwana z boku. Wstaw je do nagłówka elementem Gridboxa „Joomla Module” albo do rozwijanej części pozycji menu Gridboxa (Mega Menu), wybierając rodzaj „Otwarty panel”."
MOD_BETTERCATEGORIES_MENU_STYLE_LABEL="Rodzaj"
MOD_BETTERCATEGORIES_MENU_STYLE_DESC="Przycisk: jeden przycisk otwiera panel z kategoriami głównymi po lewej i podkategoriami wskazanej kategorii po prawej. Pasek: kategorie główne w jednym rzędzie, a każda otwiera swoje podkategorie pod paskiem. Otwarty panel: panel widoczny cały czas (do rozwijanej części menu Gridboxa)."
