MOD_BETTERCATEGORIES="Better Categories for Gridbox"
MOD_BETTERCATEGORIES_XML_DESCRIPTION="Seznam Better Categories kategorie obchodu Gridbox (nebo úvodní stránky obchodu) v libovolné pozici modulu nebo v prvku Gridbox „Joomla Module“. Používá styly pluginu Better Categories, který musí být povolen."
MOD_BETTERCATEGORIES_INFO="Zobrazí podkategorie vybrané kategorie se styly nastavenými v pluginu Better Categories (Komponenty → Better Categories for Gridbox). Pole ponechaná na „nastavení pluginu“ přebírají hodnotu pluginu. V Gridbox jej přidejte prvkem „Joomla Module“. Modul nikdy neskrývá produkty a nepřidává strukturovaná data."
