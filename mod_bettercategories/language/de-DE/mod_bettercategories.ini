MOD_BETTERCATEGORIES="Better Categories for Gridbox"
MOD_BETTERCATEGORIES_XML_DESCRIPTION="Die Better-Categories-Liste einer Gridbox-Shop-Kategorie (oder der Shop-Startseite) auf einer beliebigen Modulposition oder in einem Gridbox-Element „Joomla Module“. Verwendet die Stile des Plugins Better Categories, das aktiviert sein muss."
MOD_BETTERCATEGORIES_INFO="Zeigt die Unterkategorien der gewählten Kategorie mit den im Plugin Better Categories festgelegten Stilen (Komponenten → Better Categories for Gridbox). Felder, die auf „Plugin-Einstellung“ stehen, übernehmen den Wert des Plugins. In Gridbox fügen Sie es mit dem Element „Joomla Module“ ein. Das Modul blendet nie Produkte aus und fügt keine strukturierten Daten hinzu."
