MOD_BETTERCATEGORIES_KIND_LABEL="Anzeigen als"
MOD_BETTERCATEGORIES_KIND_DESC="Eine Liste der Unterkategorien einer Kategorie (wie auf den Shopseiten) oder das Shopmenü: der Kategoriebaum für den Kopf der Website, drei Ebenen tief."
MOD_BETTERCATEGORIES_KIND_LIST="Liste der Unterkategorien"
MOD_BETTERCATEGORIES_KIND_MENU="Shopmenü (Mega-Menü)"
MOD_BETTERCATEGORIES_MENU_NOTE="Das Shopmenü zeigt die Kategorien unter der gewählten (Shop-Startseite: die Hauptkategorien), ihre Unterkategorien mit Bild, Produktanzahl und Preis „ab“ und die Kategorien darunter. Ab 1024 px ein Panel oder eine Leiste; auf Telefonen und Tablets eine Schublade von der Seite. Fügen Sie es mit dem Gridbox-Element „Joomla Module“ in den Kopf ein oder in das Dropdown eines Gridbox-Menüpunkts (Mega Menu) mit der Art „Offenes Panel“."
MOD_BETTERCATEGORIES_MENU_STYLE_LABEL="Art"
MOD_BETTERCATEGORIES_MENU_STYLE_DESC="Schaltfläche: eine Schaltfläche öffnet ein Panel mit den Hauptkategorien links und den Unterkategorien der angezeigten rechts. Leiste: die Hauptkategorien in einer Reihe, jede öffnet ihre Unterkategorien unter der Leiste. Offenes Panel: das Panel immer sichtbar (für das Dropdown des Gridbox-Menüs)."
