MOD_BETTERCATEGORIES="Better Categories for Gridbox"
MOD_BETTERCATEGORIES_XML_DESCRIPTION="The Better Categories list of a Gridbox store category (or of the store home) in any module position or in a Gridbox “Joomla Module” element. Uses the styles of the Better Categories plugin, which must be enabled."
MOD_BETTERCATEGORIES_INFO="Shows the subcategories of the chosen category with the styles set in the Better Categories plugin (Components → Better Categories for Gridbox). Fields left at “plugin setting” keep the plugin's value. In Gridbox, add it with the “Joomla Module” element. The module never hides products and adds no structured data."
