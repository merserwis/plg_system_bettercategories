; 1.11.0: store menu
MOD_BETTERCATEGORIES_KIND_LABEL="Show as"
MOD_BETTERCATEGORIES_KIND_DESC="A list of the subcategories of one category (as on the store pages), or the store menu: the category tree for the header of the site, three levels deep."
MOD_BETTERCATEGORIES_KIND_LIST="List of subcategories"
MOD_BETTERCATEGORIES_KIND_MENU="Store menu (mega menu)"
MOD_BETTERCATEGORIES_MENU_NOTE="The store menu shows the categories under the chosen one (the store home: the top categories), their subcategories with an image, the number of products and the price “from”, and the categories under those. From 1024 px a panel or a bar; on phones and tablets a drawer from the side. Place it in the header with Gridbox's “Joomla Module” element, or in the drop-down of an item of Gridbox's menu (Mega Menu) with the kind “Open panel”."
MOD_BETTERCATEGORIES_MENU_STYLE_LABEL="Kind"
MOD_BETTERCATEGORIES_MENU_STYLE_DESC="Button: one button opens a panel with the top categories on the left and the subcategories of the one pointed at on the right. Bar: the top categories in a row, each opens its subcategories below the bar. Open panel: the panel always shown (for the drop-down of Gridbox's own menu)."
