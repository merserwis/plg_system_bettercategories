MOD_BETTERCATEGORIES="Better Categories for Gridbox"
MOD_BETTERCATEGORIES_XML_DESCRIPTION="Список Better Categories для категорії магазину Gridbox (або головної сторінки магазину) у будь-якій позиції модулів чи в елементі Gridbox «Joomla Module». Використовує стилі плагіна Better Categories, який має бути увімкнено."
MOD_BETTERCATEGORIES_INFO="Показує підкатегорії вибраної категорії зі стилями, заданими в плагіні Better Categories (Компоненти → Better Categories for Gridbox). Поля, залишені на «налаштування плагіна», зберігають значення плагіна. У Gridbox додайте модуль за допомогою елемента «Joomla Module». Модуль ніколи не приховує товари й не додає структурованих даних."
