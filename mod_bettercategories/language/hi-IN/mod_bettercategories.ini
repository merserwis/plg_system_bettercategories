MOD_BETTERCATEGORIES="Better Categories for Gridbox"
MOD_BETTERCATEGORIES_XML_DESCRIPTION="किसी Gridbox स्टोर श्रेणी (या स्टोर होम) की Better Categories सूची, किसी भी मॉड्यूल पोज़िशन में या Gridbox के “Joomla Module” एलिमेंट में। Better Categories प्लगइन की शैलियाँ उपयोग करता है, जो सक्षम होना चाहिए।"
MOD_BETTERCATEGORIES_INFO="चुनी गई श्रेणी की उप-श्रेणियाँ Better Categories प्लगइन में सेट की गई शैलियों के साथ दिखाता है (कंपोनेंट → Better Categories for Gridbox)। “प्लगइन सेटिंग” पर छोड़े गए फ़ील्ड प्लगइन का मान रखते हैं। Gridbox में इसे “Joomla Module” एलिमेंट से जोड़ें। मॉड्यूल कभी उत्पाद नहीं छिपाता और कोई संरचित डेटा नहीं जोड़ता।"
