MOD_BETTERCATEGORIES="Better Categories for Gridbox"
MOD_BETTERCATEGORIES_XML_DESCRIPTION="De Better Categories-lijst van een Gridbox-winkelcategorie (of van de winkelstartpagina) op elke modulepositie of in een Gridbox-element “Joomla Module”. Gebruikt de stijlen van de Better Categories-plugin, die ingeschakeld moet zijn."
MOD_BETTERCATEGORIES_INFO="Toont de subcategorieën van de gekozen categorie met de stijlen die in de Better Categories-plugin zijn ingesteld (Componenten → Better Categories for Gridbox). Velden die op “plugininstelling” blijven staan, behouden de waarde van de plugin. Voeg de module in Gridbox toe met het element “Joomla Module”. De module verbergt nooit producten en voegt geen gestructureerde gegevens toe."
