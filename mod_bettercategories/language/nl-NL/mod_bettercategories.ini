MOD_BETTERCATEGORIES_KIND_LABEL="Tonen als"
MOD_BETTERCATEGORIES_KIND_DESC="Een lijst met de subcategorieën van één categorie (zoals op de winkelpagina's) of het winkelmenu: de categorieboom voor de kop van de site, drie niveaus diep."
MOD_BETTERCATEGORIES_KIND_LIST="Lijst met subcategorieën"
MOD_BETTERCATEGORIES_KIND_MENU="Winkelmenu (megamenu)"
MOD_BETTERCATEGORIES_MENU_NOTE="Het winkelmenu toont de categorieën onder de gekozen categorie (startpagina van de winkel: de hoofdcategorieën), hun subcategorieën met een afbeelding, het aantal producten en de prijs „vanaf”, en de categorieën daaronder. Vanaf 1024 px een paneel of balk; op telefoons en tablets een lade vanaf de zijkant. Plaats het in de kop met het Gridbox-element „Joomla Module” of in de uitklap van een item van het Gridbox-menu (Mega Menu) met het soort „Open paneel”."
MOD_BETTERCATEGORIES_MENU_STYLE_LABEL="Soort"
MOD_BETTERCATEGORIES_MENU_STYLE_DESC="Knop: één knop opent een paneel met de hoofdcategorieën links en de subcategorieën van de aangewezen categorie rechts. Balk: de hoofdcategorieën op een rij, elk opent zijn subcategorieën onder de balk. Open paneel: het paneel altijd zichtbaar (voor de uitklap van het Gridbox-menu)."
