MOD_BETTERCATEGORIES_XML_DESCRIPTION="De Better Categories-lijst van een Gridbox-winkelcategorie (of van de winkelstartpagina) op elke modulepositie of in een Gridbox-element “Joomla Module”. Gebruikt de stijlen van de Better Categories-plugin, die ingeschakeld moet zijn."
