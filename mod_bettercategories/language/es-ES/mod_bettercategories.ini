MOD_BETTERCATEGORIES="Better Categories for Gridbox"
MOD_BETTERCATEGORIES_XML_DESCRIPTION="La lista de Better Categories de una categoría de la tienda Gridbox (o del inicio de la tienda) en cualquier posición de módulo o en un elemento «Joomla Module» de Gridbox. Usa los estilos del plugin Better Categories, que debe estar activado."
MOD_BETTERCATEGORIES_INFO="Muestra las subcategorías de la categoría elegida con los estilos definidos en el plugin Better Categories (Componentes → Better Categories for Gridbox). Los campos que se dejan en «ajuste del plugin» mantienen el valor del plugin. En Gridbox, añádalo con el elemento «Joomla Module». El módulo nunca oculta productos ni añade datos estructurados."
