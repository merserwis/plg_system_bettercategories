MOD_BETTERCATEGORIES_INFO="تعرض الفئات الفرعية للفئة المختارة بالأنماط المحددة في إضافة Better Categories (المكونات ← Better Categories for Gridbox). الحقول المتروكة على «إعداد الإضافة» تحتفظ بقيمة الإضافة. في Gridbox، أضفها باستخدام العنصر «Joomla Module». لا تخفي الوحدة المنتجات أبدًا ولا تضيف بيانات منظَّمة."
