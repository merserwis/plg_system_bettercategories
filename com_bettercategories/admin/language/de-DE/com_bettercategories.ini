COM_BETTERCATEGORIES_NO_PLUGIN="Das Plugin System - Better Categories for Gridbox wurde nicht gefunden. Installieren Sie das Paket Better Categories erneut."
COM_BETTERCATEGORIES_NO_GRIDBOX="Gridbox ist nicht installiert oder deaktiviert. Better Categories funktioniert nur mit Balbooa Gridbox."
COM_BETTERCATEGORIES_NO_STORE="Diese Website hat keinen Gridbox-Shop (eine App für Produkte). Better Categories arbeitet auf den Kategorieseiten eines Shops."
COM_BETTERCATEGORIES_OPEN_GRIDBOX="Gridbox öffnen"
COM_BETTERCATEGORIES_PAGE_LIST="Kategorieliste"
COM_BETTERCATEGORIES_PAGE_LIST_DESC="Die Liste der Unterkategorien, die Better Categories den Shopseiten hinzufügt: Überschrift und Produktzahlen, Platz auf der Seite, Spalten und Abstände, Text und Farben sowie andere Einstellungen für andere Ebenen des Baums. Die Vorschau zeigt Ihre ungespeicherten Änderungen."
COM_BETTERCATEGORIES_PAGE_TILES="Kacheln"
COM_BETTERCATEGORIES_PAGE_TILES_DESC="Die Kategorien als Bildkacheln: Stil, Effekte und Schatten, woher die Bilder kommen, die leichteren Kopien der Bilder und die Symbole. Gilt, wenn die Liste die Kategorien als Kacheln zeigt. Die Vorschau zeigt Ihre ungespeicherten Änderungen."
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES="Unterkategorien"
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES_DESC="Was jede Kategorie der Liste enthält: ihre Unterkategorien darunter, in einer Schublade, auf der Rückseite der Kachel oder in einer Sprechblase. Die Vorschau zeigt Ihre ungespeicherten Änderungen."
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS="Kategoriebeschreibungen"
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS_DESC="Die in Gridbox geschriebene Beschreibung der Kategorie auf ihrer Seite: wo sie steht, ein kurzer Einleitungstext getrennt vom Rest und ein langer Text, eingeklappt mit einer Schaltfläche „Weiterlesen“."
COM_BETTERCATEGORIES_PAGE_NAVIGATION="Navigation"
COM_BETTERCATEGORIES_PAGE_NAVIGATION_DESC="Auf einer Kategorie der letzten Ebene Links zu den benachbarten Kategorien und zurück zur übergeordneten; im Gridbox-Element Kategorien Zeilen, die ihre Unterkategorien öffnen. Die Vorschau zeigt Ihre ungespeicherten Änderungen."
COM_BETTERCATEGORIES_PAGE_FILTERS="Filter"
COM_BETTERCATEGORIES_PAGE_FILTERS_DESC="Filter der Produktliste: Preis, Produktfelder, aus den Beschreibungen gelesene technische Parameter, Merkmale, Angebot und Verfügbarkeit. Wo sie stehen, wie sie aussehen und was sie sagen."
COM_BETTERCATEGORIES_PAGE_CONFIG="Konfiguration"
COM_BETTERCATEGORIES_PAGE_CONFIG_DESC="Was einmal eingestellt und vergessen wird: die Shops und der Cache, die strukturierten Daten für Suchmaschinen und die Einstellungsdatei."
COM_BETTERCATEGORIES_PLUGIN_OFF="Das Plugin System - Better Categories for Gridbox ist deaktiviert, daher sehen die Shopseiten so aus, wie Gridbox sie zeigt, und die Einstellungen können nicht angezeigt werden."
COM_BETTERCATEGORIES_SAVED="Einstellungen gespeichert."
COM_BETTERCATEGORIES_SETUP_INTRO="Die wichtigsten Schalter der Shopseiten an einem Ort. Bei jedem steht, ob er für die meisten Websites empfohlen ist, und die Schaltfläche unten schaltet alle empfohlenen ein (die optionalen bleiben, wie sie sind). Gespeichert werden nur die Schalter, die Sie ändern. Die Einzelheiten stehen danach auf der Seite jedes Teils."
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_LABEL="Produktanzahl"
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_DESC="Die Zahl der Produkte neben jeder Kategorie der Liste."
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_LABEL="Leere Kategorien ausblenden"
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_DESC="Eine Unterkategorie ohne Produkte erscheint nicht in der Liste."
COM_BETTERCATEGORIES_SETUP_QS_TILES_LABEL="Kategorien als Bildkacheln"
COM_BETTERCATEGORIES_SETUP_QS_TILES_DESC="Jede Kategorie der Liste ist eine Kachel mit ihrem Bild statt eines Textlinks."
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_LABEL="Leichtere Bilder in den Kacheln"
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_DESC="Die Kacheln zeigen kleine Kopien der Bilder, einmal auf dem Server erstellt, statt der vollen Fotos, damit die Seite schneller öffnet."
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_LABEL="Erste Kachelreihe zuerst"
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_DESC="Die Bilder der ersten Reihe laden sofort, die anderen beim Scrollen, damit der obere Teil der Seite früher erscheint."
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_LABEL="Unterkategorien in der Liste"
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_DESC="Jede Kategorie der Liste zeigt die Namen ihrer Unterkategorien. Wo (darunter, in einer Schublade, auf der Rückseite der Kachel) stellen Sie auf der Seite Unterkategorien ein."
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_LABEL="Kategoriebeschreibungen"
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_DESC="Die in Gridbox geschriebene Beschreibung der Kategorie auf ihrer Seite: dort, wo das Kategorie-Layout sie hat, oder an einer Stelle Ihrer Wahl."
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_LABEL="Lange Beschreibungen einklappen"
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_DESC="Eine lange Beschreibung wird auf wenige Zeilen eingeklappt, mit einer Schaltfläche „Weiterlesen“. Funktioniert mit eingeschalteten Kategoriebeschreibungen."
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_LABEL="Benachbarte Kategorien"
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_DESC="Eine Kategorie der letzten Ebene zeigt eine Leiste mit den Kategorien daneben und einen Link zurück zur übergeordneten."
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_LABEL="Zeilen des Elements Kategorien"
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_DESC="Im Gridbox-Element Kategorien öffnet ein Klick auf die Zeile einer Kategorie mit Unterkategorien diese, statt zu ihrer Seite zu gehen."
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_LABEL="Strukturierte Daten"
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_DESC="Die Liste der Kategorien und die Breadcrumbs für Suchmaschinen (schema.org); die Breadcrumbs nur, wenn die Seite keine eigenen hat."
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_LABEL="Produktfilter"
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_DESC="Filter neben der Produktliste: Preis, Felder, Parameter, Merkmale, Angebot, Verfügbarkeit. Welche, wählen Sie auf der Seite Filter."
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_LABEL="Gefilterte Listen nicht in Suchmaschinen"
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_DESC="Eine Liste mit gewählten Filtern erhält noindex, follow, damit Suchmaschinen die Kategorieseite indexieren und nicht jede Filterkombination."
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_LABEL="Raster oder Liste"
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_DESC="Zwei Schaltflächen über den Produkten zeigen sie als Raster oder als Liste. Funktioniert mit eingeschalteten Produktfiltern."
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_LABEL="Link „Alle anzeigen“"
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_DESC="Alle Produkte der Kategorie auf einer Seite (bis zu einer Grenze) statt der Seiten von Gridbox. Funktioniert mit eingeschalteten Produktfiltern."
