COM_BETTERCATEGORIES_GROUP_LIST="Kategorieliste"
COM_BETTERCATEGORIES_GROUP_LIST_DESC="Die Liste der Unterkategorien auf den Shopseiten: was sie zeigt, wo, als Textlinks oder Bildkacheln."
COM_BETTERCATEGORIES_GROUP_PAGE="Kategorieseiten"
COM_BETTERCATEGORIES_GROUP_PAGE_DESC="Die Beschreibung der Kategorie und der Weg zwischen den Kategorien."
COM_BETTERCATEGORIES_GROUP_PRODUCTS="Produkte"
COM_BETTERCATEGORIES_GROUP_PRODUCTS_DESC="Filter der Produktliste auf den Kategorieseiten."
