COM_BETTERCATEGORIES_CFG_BACKUP="Einstellungsdatei"
COM_BETTERCATEGORIES_CFG_BACKUP_DESC="Die Einstellungen in einer Datei speichern, auf einer anderen Website laden oder zu den Standardwerten zurückkehren."
COM_BETTERCATEGORIES_CHECK_TEXT="Prüfen Sie nach dem Einschalten oder Ändern jeder Einstellung auf Ihrer eigenen Website, ob sie richtig funktioniert: als Gast (in einem privaten Fenster), am Computer und am Telefon, auf mehreren Arten von Seiten (Startseite des Shops, eine Kategorie mit Unterkategorien, eine Kategorie der letzten Ebene, eine gefilterte Liste). Jeder Joomla- und Gridbox-Shop ist anders aufgebaut. Wenn etwas nicht richtig funktioniert, schalten Sie diesen Teil aus und melden Sie das Problem."
COM_BETTERCATEGORIES_CHECK_SITE="Prüfen Sie auf Ihrer Website, ob das Geänderte richtig funktioniert, am besten als Gast in einem privaten Fenster: die Startseite des Shops, eine Kategorie mit Unterkategorien und eine Kategorie der letzten Ebene."
