COM_BETTERCATEGORIES_NO_PLUGIN="Plugin System - Better Categories for Gridbox nebyl nalezen. Nainstalujte balíček Better Categories znovu."
COM_BETTERCATEGORIES_NO_GRIDBOX="Gridbox není nainstalován nebo je vypnutý. Better Categories funguje jen s Balbooa Gridbox."
COM_BETTERCATEGORIES_NO_STORE="Tento web nemá obchod Gridboxu (aplikaci produktů). Better Categories pracuje na stránkách kategorií obchodu."
COM_BETTERCATEGORIES_OPEN_GRIDBOX="Otevřít Gridbox"
COM_BETTERCATEGORIES_PAGE_LIST="Seznam kategorií"
COM_BETTERCATEGORIES_PAGE_LIST_DESC="Seznam podkategorií, který Better Categories přidává na stránky obchodu: nadpis a počty produktů, umístění, sloupce a mezery, text a barvy a jiná nastavení pro jiné úrovně stromu. Náhled ukazuje neuložené změny."
COM_BETTERCATEGORIES_PAGE_TILES="Dlaždice"
COM_BETTERCATEGORIES_PAGE_TILES_DESC="Kategorie jako dlaždice s obrázky: styl, efekty a stín, odkud se berou obrázky, lehčí kopie obrázků a ikony. Platí, když seznam ukazuje kategorie jako dlaždice. Náhled ukazuje neuložené změny."
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES="Podkategorie"
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES_DESC="Co obsahuje každá kategorie seznamu: její podkategorie pod ní, v zásuvce, na rubu dlaždice nebo v bublině. Náhled ukazuje neuložené změny."
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS="Popisy kategorií"
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS_DESC="Popis kategorie napsaný v Gridboxu na její stránce: kde stojí, krátký úvod odděleně od zbytku a dlouhý text sbalený s tlačítkem „Číst dále“."
COM_BETTERCATEGORIES_PAGE_NAVIGATION="Navigace"
COM_BETTERCATEGORIES_PAGE_NAVIGATION_DESC="Na kategorii poslední úrovně odkazy na sousední kategorie a zpět na nadřazenou; v prvku Kategorie v Gridboxu řádky, které rozbalují podkategorie. Náhled ukazuje neuložené změny."
COM_BETTERCATEGORIES_PAGE_FILTERS="Filtry"
COM_BETTERCATEGORIES_PAGE_FILTERS_DESC="Filtry seznamu produktů: cena, pole produktu, technické parametry z popisů, vlastnosti, sleva a dostupnost. Kde stojí, jak vypadají a co říkají."
COM_BETTERCATEGORIES_PAGE_CONFIG="Konfigurace"
COM_BETTERCATEGORIES_PAGE_CONFIG_DESC="Co se nastaví jednou a zapomene: obchody a mezipaměť, strukturovaná data pro vyhledávače a soubor nastavení."
COM_BETTERCATEGORIES_PLUGIN_OFF="Plugin System - Better Categories for Gridbox je vypnutý, takže stránky obchodu vypadají tak, jak je ukazuje Gridbox, a nastavení nelze zobrazit."
COM_BETTERCATEGORIES_SAVED="Nastavení uloženo."
COM_BETTERCATEGORIES_SETUP_INTRO="Hlavní přepínače stránek obchodu na jednom místě. U každého je vidět, zda je doporučený pro většinu webů, a tlačítko níže zapne všechny doporučené (volitelné zůstanou, jak jsou). Ukládají se jen přepínače, které změníte. Podrobnosti jsou pak na stránce každé části."
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_LABEL="Počty produktů"
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_DESC="Počet produktů u každé kategorie seznamu."
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_LABEL="Skrýt prázdné kategorie"
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_DESC="Podkategorie bez produktů se v seznamu nezobrazí."
COM_BETTERCATEGORIES_SETUP_QS_TILES_LABEL="Kategorie jako dlaždice s obrázky"
COM_BETTERCATEGORIES_SETUP_QS_TILES_DESC="Každá kategorie seznamu je dlaždice s obrázkem místo textového odkazu."
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_LABEL="Lehčí obrázky v dlaždicích"
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_DESC="Dlaždice ukazují malé kopie obrázků, vytvořené jednou na serveru, místo celých fotografií, takže se stránka otevře rychleji."
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_LABEL="Nejdřív první řada dlaždic"
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_DESC="Obrázky první řady se načtou hned a ostatní při posunutí, takže horní část stránky se ukáže dříve."
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_LABEL="Podkategorie v seznamu"
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_DESC="Každá kategorie seznamu ukazuje názvy svých podkategorií. Kde (pod ní, v zásuvce, na rubu dlaždice) se nastaví na stránce Podkategorie."
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_LABEL="Popisy kategorií"
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_DESC="Popis kategorie napsaný v Gridboxu na její stránce: tam, kde ho má rozvržení kategorie, nebo na zvoleném místě."
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_LABEL="Sbalit dlouhé popisy"
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_DESC="Dlouhý popis je sbalený na několik řádků s tlačítkem „Číst dále“. Funguje se zapnutými popisy kategorií."
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_LABEL="Sousední kategorie"
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_DESC="Kategorie poslední úrovně ukazuje lištu s kategoriemi vedle ní a odkaz zpět na nadřazenou."
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_LABEL="Řádky prvku Kategorie"
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_DESC="V prvku Kategorie v Gridboxu klepnutí na řádek kategorie s podkategoriemi je rozbalí, místo aby přešlo na její stránku."
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_LABEL="Strukturovaná data"
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_DESC="Seznam kategorií a drobečková navigace pro vyhledávače (schema.org); drobečková navigace jen tehdy, když stránka nemá vlastní."
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_LABEL="Filtry produktů"
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_DESC="Filtry u seznamu produktů: cena, pole, parametry, vlastnosti, sleva, dostupnost. Které, zvolíte na stránce Filtry."
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_LABEL="Seznamy s filtry mimo vyhledávače"
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_DESC="Seznam se zvolenými filtry dostane noindex, follow, takže vyhledávače indexují stránku kategorie, a ne každou kombinaci filtrů."
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_LABEL="Mřížka nebo seznam"
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_DESC="Dvě tlačítka nad produkty je ukážou jako mřížku nebo seznam. Funguje se zapnutými filtry produktů."
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_LABEL="Odkaz „Zobrazit vše“"
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_DESC="Všechny produkty kategorie na jedné stránce (do limitu) místo stránek Gridboxu. Funguje se zapnutými filtry produktů."
