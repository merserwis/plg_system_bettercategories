COM_BETTERCATEGORIES_CHECK_TEXT="Po zapnutí nebo změně jakéhokoli nastavení zkontrolujte na svém webu, že funguje, jak má: jako host (v anonymním okně), na počítači i na telefonu, na několika druzích stránek (úvodní stránka obchodu, kategorie s podkategoriemi, kategorie poslední úrovně, seznam s filtry). Každý obchod na Joomle a Gridboxu je postaven jinak. Pokud něco nefunguje správně, vypněte tu část a nahlaste problém."
COM_BETTERCATEGORIES_CHECK_SITE="Zkontrolujte na webu, že to, co jste změnili, funguje, jak má, nejlépe jako host v anonymním okně: úvodní stránka obchodu, kategorie s podkategoriemi a kategorie poslední úrovně."
