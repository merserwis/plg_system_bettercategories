COM_BETTERCATEGORIES_NO_PLUGIN="Nie znaleziono wtyczki System - Better Categories for Gridbox. Zainstaluj ponownie pakiet Better Categories."
COM_BETTERCATEGORIES_NO_GRIDBOX="Gridbox nie jest zainstalowany albo jest wyłączony. Better Categories działa tylko z Balbooa Gridbox."
COM_BETTERCATEGORIES_NO_STORE="Ta witryna nie ma sklepu Gridboxa (aplikacji produktów). Better Categories działa na stronach kategorii sklepu."
COM_BETTERCATEGORIES_OPEN_GRIDBOX="Otwórz Gridbox"
COM_BETTERCATEGORIES_PAGE_LIST="Lista kategorii"
COM_BETTERCATEGORIES_PAGE_LIST_DESC="Lista podkategorii, którą Better Categories dodaje do stron sklepu: nagłówek i liczby produktów, miejsce na stronie, kolumny i odstępy, tekst i kolory oraz inne ustawienia dla innych poziomów drzewa. Podgląd pokazuje niezapisane zmiany."
COM_BETTERCATEGORIES_PAGE_TILES="Kafelki"
COM_BETTERCATEGORIES_PAGE_TILES_DESC="Kategorie jako kafelki z obrazami: styl, efekty i cień, skąd biorą się obrazy, lżejsze kopie obrazów i ikony. Działa, gdy lista pokazuje kategorie jako kafelki. Podgląd pokazuje niezapisane zmiany."
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES="Podkategorie"
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES_DESC="Co zawiera każda kategoria z listy: jej podkategorie pod nią, w szufladzie, na odwrocie kafelka albo w dymku. Podgląd pokazuje niezapisane zmiany."
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS="Opisy kategorii"
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS_DESC="Opis kategorii napisany w Gridboxie, na jej stronie: gdzie stoi, krótki wstęp osobno od reszty i długi tekst zwinięty z przyciskiem „Rozwiń opis”."
COM_BETTERCATEGORIES_PAGE_NAVIGATION="Nawigacja"
COM_BETTERCATEGORIES_PAGE_NAVIGATION_DESC="Na kategorii ostatniego poziomu linki do sąsiednich kategorii i powrót do nadrzędnej; w elemencie Kategorie Gridboxa wiersze, które rozwijają podkategorie. Podgląd pokazuje niezapisane zmiany."
COM_BETTERCATEGORIES_PAGE_FILTERS="Filtry"
COM_BETTERCATEGORIES_PAGE_FILTERS_DESC="Filtry listy produktów: cena, pola produktu, parametry techniczne odczytane z opisów, cechy, promocja i dostępność. Gdzie stoją, jak wyglądają i co mówią."
COM_BETTERCATEGORIES_PAGE_CONFIG="Konfiguracja"
COM_BETTERCATEGORIES_PAGE_CONFIG_DESC="To, co ustawia się raz i zapomina: sklepy i pamięć podręczna, dane strukturalne dla wyszukiwarek oraz plik ustawień."
COM_BETTERCATEGORIES_PLUGIN_OFF="Wtyczka System - Better Categories for Gridbox jest wyłączona, więc strony sklepu wyglądają tak, jak pokazuje je Gridbox, a ustawień nie da się wyświetlić."
COM_BETTERCATEGORIES_SAVED="Ustawienia zapisane."
COM_BETTERCATEGORIES_SETUP_INTRO="Główne przełączniki stron sklepu w jednym miejscu. Przy każdym widać, czy jest zalecany dla większości stron, a przycisk poniżej włącza wszystkie zalecane (opcjonalne zostają bez zmian). Zapisywane są tylko przełączniki, które zmienisz. Szczegóły są potem na stronie każdej części."
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_LABEL="Liczba produktów"
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_DESC="Liczba produktów przy każdej kategorii na liście."
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_LABEL="Ukryj puste kategorie"
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_DESC="Podkategoria bez produktów nie pojawia się na liście."
COM_BETTERCATEGORIES_SETUP_QS_TILES_LABEL="Kategorie jako kafelki z obrazami"
COM_BETTERCATEGORIES_SETUP_QS_TILES_DESC="Każda kategoria na liście jest kafelkiem z obrazem zamiast linku tekstowego."
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_LABEL="Lżejsze obrazy w kafelkach"
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_DESC="Kafelki pokazują małe kopie obrazów, robione raz na serwerze, zamiast pełnych zdjęć, więc strona otwiera się szybciej."
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_LABEL="Najpierw pierwszy rząd kafelków"
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_DESC="Obrazy pierwszego rzędu ładują się od razu, pozostałe po przewinięciu, więc góra strony pojawia się szybciej."
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_LABEL="Podkategorie na liście"
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_DESC="Każda kategoria na liście pokazuje nazwy swoich podkategorii. Gdzie (pod nią, w szufladzie, na odwrocie kafelka) ustawia się na stronie Podkategorie."
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_LABEL="Opisy kategorii"
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_DESC="Opis kategorii napisany w Gridboxie, na jej stronie: tam, gdzie ma go układ kategorii, albo w wybranym miejscu."
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_LABEL="Zwijaj długie opisy"
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_DESC="Długi opis jest zwinięty do kilku linijek z przyciskiem „Rozwiń opis”. Działa przy włączonych opisach kategorii."
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_LABEL="Sąsiednie kategorie"
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_DESC="Kategoria ostatniego poziomu pokazuje pasek z kategoriami obok niej i link powrotu do nadrzędnej."
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_LABEL="Wiersze elementu Kategorie"
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_DESC="W elemencie Kategorie Gridboxa kliknięcie w wiersz kategorii z podkategoriami rozwija je, zamiast przechodzić na jej stronę."
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_LABEL="Dane strukturalne"
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_DESC="Lista kategorii i okruszki dla wyszukiwarek (schema.org); okruszki tylko wtedy, gdy strona nie ma własnych."
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_LABEL="Filtry produktów"
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_DESC="Filtry przy liście produktów: cena, pola, parametry, cechy, promocja, dostępność. Które, wybierasz na stronie Filtry."
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_LABEL="Listy z filtrami poza wyszukiwarkami"
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_DESC="Lista z wybranymi filtrami dostaje noindex, follow, więc wyszukiwarki indeksują stronę kategorii, a nie każde połączenie filtrów."
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_LABEL="Siatka albo lista"
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_DESC="Dwa przyciski nad produktami pokazują je jako siatkę albo listę. Działa przy włączonych filtrach produktów."
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_LABEL="Link „Pokaż wszystkie”"
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_DESC="Wszystkie produkty kategorii na jednej stronie (do limitu) zamiast stron Gridboxa. Działa przy włączonych filtrach produktów."
