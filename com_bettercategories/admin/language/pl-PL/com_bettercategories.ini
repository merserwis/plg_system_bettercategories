COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_LABEL="Dane strukturalne"
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_DESC="Listy kategorii i produktów oraz okruszki dla wyszukiwarek (schema.org); okruszki tylko wtedy, gdy strona nie ma własnych."
