COM_BETTERCATEGORIES_CFG_BACKUP_DESC="Zapisz ustawienia do pliku, wczytaj je na innej stronie albo wróć do wartości domyślnych."
COM_BETTERCATEGORIES_CHECK_TEXT="Po włączeniu lub zmianie dowolnego ustawienia sprawdź na swojej stronie, czy działa jak należy: jako gość (w oknie prywatnym), na komputerze i na telefonie, na kilku rodzajach stron (strona główna sklepu, kategoria z podkategoriami, kategoria ostatniego poziomu, lista z filtrami). Każdy sklep na Joomli i Gridboxie jest zbudowany inaczej. Jeśli coś nie działa dobrze, wyłącz tę część i zgłoś problem."
COM_BETTERCATEGORIES_CHECK_SITE="Sprawdź na stronie, czy to, co zmieniłeś, działa jak należy, najlepiej jako gość w oknie prywatnym: strona główna sklepu, kategoria z podkategoriami i kategoria ostatniego poziomu."
