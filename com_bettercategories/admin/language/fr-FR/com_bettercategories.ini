COM_BETTERCATEGORIES="Better Categories for Gridbox"
COM_BETTERCATEGORIES_ACTIONS="Raccourcis"
COM_BETTERCATEGORIES_CACHE_CLEARED="Le cache des listes et les pages conservées sont vidés."
COM_BETTERCATEGORIES_CFG_BASIC="Général"
COM_BETTERCATEGORIES_CFG_BASIC_DESC="Les boutiques où le plugin travaille, la durée de conservation d'une liste prête et où signaler un problème."
COM_BETTERCATEGORIES_CFG_SEO="Données structurées"
COM_BETTERCATEGORIES_CFG_SEO_DESC="La liste des catégories et le fil d'Ariane pour les moteurs de recherche (schema.org)."
COM_BETTERCATEGORIES_CFG_BACKUP="Fichier de paramètres"
COM_BETTERCATEGORIES_CFG_BACKUP_DESC="Enregistrez les paramètres dans un fichier, chargez-les sur un autre site ou revenez aux valeurs par défaut."
COM_BETTERCATEGORIES_CHECK_TEXT="Après avoir activé ou modifié un réglage, vérifiez sur votre propre site qu'il fonctionne comme il faut : en tant qu'invité (dans une fenêtre privée), sur un ordinateur et sur un téléphone, sur plusieurs types de pages (l'accueil de la boutique, une catégorie avec sous-catégories, une catégorie du dernier niveau, une liste filtrée). Chaque boutique Joomla + Gridbox est construite différemment. Si quelque chose ne fonctionne pas bien, désactivez cette partie et signalez le problème."
COM_BETTERCATEGORIES_CHECK_SITE="Vérifiez sur votre site que ce que vous avez modifié fonctionne comme il faut, de préférence en tant qu'invité dans une fenêtre privée : l'accueil de la boutique, une catégorie avec sous-catégories et une catégorie du dernier niveau."
COM_BETTERCATEGORIES_CHECK_TITLE="Vérifiez votre site"
