COM_BETTERCATEGORIES_MENU_CONFIG="Configuration"
COM_BETTERCATEGORIES_NO_PLUGIN="Le plugin System - Better Categories for Gridbox est introuvable. Installez à nouveau le paquet Better Categories."
COM_BETTERCATEGORIES_NO_GRIDBOX="Gridbox n'est pas installé ou est désactivé. Better Categories fonctionne uniquement avec Balbooa Gridbox."
COM_BETTERCATEGORIES_NO_STORE="Ce site n'a pas de boutique Gridbox (une application de produits). Better Categories travaille sur les pages de catégorie d'une boutique."
COM_BETTERCATEGORIES_OPEN_GRIDBOX="Ouvrir Gridbox"
COM_BETTERCATEGORIES_PAGE_LIST="Liste des catégories"
COM_BETTERCATEGORIES_PAGE_LIST_DESC="La liste des sous-catégories que Better Categories ajoute aux pages de la boutique : son titre et le nombre de produits, sa place, ses colonnes et espacements, son texte et ses couleurs, et d'autres réglages pour d'autres niveaux de l'arborescence. L'aperçu montre vos modifications non enregistrées."
COM_BETTERCATEGORIES_PAGE_TILES="Vignettes"
COM_BETTERCATEGORIES_PAGE_TILES_DESC="Les catégories en vignettes avec image : leur style, leurs effets et leur ombre, d'où viennent les images, les copies allégées des images et les icônes. Utilisé quand la liste montre les catégories en vignettes. L'aperçu montre vos modifications non enregistrées."
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES="Sous-catégories"
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES_DESC="Ce que contient chaque catégorie de la liste : ses sous-catégories en dessous, dans un tiroir, au dos de la vignette ou dans une bulle. L'aperçu montre vos modifications non enregistrées."
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS="Descriptions des catégories"
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS_DESC="La description de la catégorie, écrite dans Gridbox, sur sa page : où elle se trouve, une courte introduction séparée du reste, et un long texte replié avec un bouton « Lire la suite »."
COM_BETTERCATEGORIES_PAGE_NAVIGATION="Navigation"
COM_BETTERCATEGORIES_PAGE_NAVIGATION_DESC="Sur une catégorie du dernier niveau, des liens vers les catégories voisines et vers la catégorie parente ; dans l'élément Catégories de Gridbox, des lignes qui ouvrent leurs sous-catégories. L'aperçu montre vos modifications non enregistrées."
COM_BETTERCATEGORIES_PAGE_FILTERS="Filtres"
COM_BETTERCATEGORIES_PAGE_FILTERS_DESC="Les filtres de la liste des produits : prix, champs du produit, paramètres techniques lus dans les descriptions, caractéristiques, promotion et stock. Où ils se trouvent, leur apparence et leurs textes."
COM_BETTERCATEGORIES_PAGE_CONFIG="Configuration"
COM_BETTERCATEGORIES_PAGE_CONFIG_DESC="Ce qui se règle une fois pour toutes : les boutiques et le cache, les données structurées pour les moteurs de recherche et le fichier de paramètres."
COM_BETTERCATEGORIES_PLUGIN_OFF="Le plugin System - Better Categories for Gridbox est désactivé : les pages de la boutique sont telles que Gridbox les affiche et les réglages ne peuvent pas être affichés."
COM_BETTERCATEGORIES_SAVED="Paramètres enregistrés."
COM_BETTERCATEGORIES_SETUP_INTRO="Les principaux interrupteurs des pages de la boutique en un seul endroit. Chacun indique s'il est recommandé pour la plupart des sites, et le bouton ci-dessous active tous ceux qui sont recommandés (les optionnels restent tels quels). Seuls les interrupteurs que vous modifiez sont enregistrés. Les détails se trouvent ensuite sur la page de chaque partie."
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_LABEL="Nombre de produits"
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_DESC="Le nombre de produits à côté de chaque catégorie de la liste."
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_LABEL="Masquer les catégories vides"
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_DESC="Une sous-catégorie sans produits n'apparaît pas dans la liste."
COM_BETTERCATEGORIES_SETUP_QS_TILES_LABEL="Catégories en vignettes avec image"
COM_BETTERCATEGORIES_SETUP_QS_TILES_DESC="Chaque catégorie de la liste est une vignette avec son image au lieu d'un lien texte."
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_LABEL="Images allégées dans les vignettes"
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_DESC="Les vignettes montrent de petites copies des images, créées une fois sur le serveur, au lieu des photos entières : la page s'ouvre plus vite."
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_LABEL="Première rangée de vignettes d'abord"
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_DESC="Les images de la première rangée se chargent tout de suite et les autres au défilement : le haut de la page s'affiche plus tôt."
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_LABEL="Sous-catégories dans la liste"
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_DESC="Chaque catégorie de la liste montre les noms de ses sous-catégories. Leur place (en dessous, dans un tiroir, au dos de la vignette) se règle sur la page Sous-catégories."
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_LABEL="Descriptions des catégories"
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_DESC="La description de la catégorie, écrite dans Gridbox, sur sa page : là où la mise en page de la catégorie la prévoit ou à l'endroit choisi."
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_LABEL="Replier les longues descriptions"
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_DESC="Une longue description est repliée sur quelques lignes avec un bouton « Lire la suite ». Fonctionne avec les descriptions des catégories activées."
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_LABEL="Catégories voisines"
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_DESC="Une catégorie du dernier niveau montre une barre avec les catégories voisines et un lien vers la catégorie parente."
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_LABEL="Lignes de l'élément Catégories"
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_DESC="Dans l'élément Catégories de Gridbox, un clic sur la ligne d'une catégorie avec sous-catégories les ouvre au lieu d'aller à sa page."
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_LABEL="Données structurées"
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_DESC="La liste des catégories et le fil d'Ariane pour les moteurs de recherche (schema.org) ; le fil d'Ariane seulement si la page n'a pas le sien."
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_LABEL="Filtres de produits"
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_DESC="Des filtres à côté de la liste des produits : prix, champs, paramètres, caractéristiques, promotion, stock. Lesquels se choisit sur la page Filtres."
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_LABEL="Listes filtrées hors des moteurs de recherche"
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_DESC="Une liste avec des filtres choisis reçoit noindex, follow : les moteurs de recherche indexent la page de catégorie et non chaque combinaison de filtres."
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_LABEL="Grille ou liste"
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_DESC="Deux boutons au-dessus des produits les montrent en grille ou en liste. Fonctionne avec les filtres de produits activés."
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_LABEL="Lien « Tout afficher »"
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_DESC="Tous les produits de la catégorie sur une seule page (jusqu'à une limite) au lieu des pages de Gridbox. Fonctionne avec les filtres de produits activés."
COM_BETTERCATEGORIES_SETUP_RECOMMENDED_ALL="Activer les recommandés"
