COM_BETTERCATEGORIES_GROUP_LIST="Liste des catégories"
COM_BETTERCATEGORIES_GROUP_LIST_DESC="La liste des sous-catégories sur les pages de la boutique : ce qu'elle montre, où, en liens texte ou en vignettes avec image."
COM_BETTERCATEGORIES_GROUP_PAGE="Pages de catégorie"
COM_BETTERCATEGORIES_GROUP_PAGE_DESC="La description de la catégorie et le passage d'une catégorie à l'autre."
COM_BETTERCATEGORIES_GROUP_PRODUCTS="Produits"
COM_BETTERCATEGORIES_GROUP_PRODUCTS_DESC="Les filtres de la liste des produits sur les pages de catégorie."
COM_BETTERCATEGORIES_GROUP_CONFIG="Configuration"
COM_BETTERCATEGORIES_GROUP_CONFIG_DESC="À régler une fois, puis à oublier."
