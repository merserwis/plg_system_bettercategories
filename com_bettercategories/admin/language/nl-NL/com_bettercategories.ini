COM_BETTERCATEGORIES_NO_PLUGIN="De plugin System - Better Categories for Gridbox is niet gevonden. Installeer het pakket Better Categories opnieuw."
COM_BETTERCATEGORIES_NO_GRIDBOX="Gridbox is niet geïnstalleerd of uitgeschakeld. Better Categories werkt alleen met Balbooa Gridbox."
COM_BETTERCATEGORIES_NO_STORE="Deze site heeft geen Gridbox-winkel (een app met producten). Better Categories werkt op de categoriepagina's van een winkel."
COM_BETTERCATEGORIES_OPEN_GRIDBOX="Gridbox openen"
COM_BETTERCATEGORIES_PAGE_LIST="Categorielijst"
COM_BETTERCATEGORIES_PAGE_LIST_DESC="De lijst van subcategorieën die Better Categories aan de winkelpagina's toevoegt: de kop en het aantal producten, de plaats op de pagina, de kolommen en afstanden, de tekst en kleuren, en andere instellingen voor andere niveaus van de boom. De voorbeeldweergave toont uw niet-opgeslagen wijzigingen."
COM_BETTERCATEGORIES_PAGE_TILES="Tegels"
COM_BETTERCATEGORIES_PAGE_TILES_DESC="De categorieën als tegels met afbeelding: stijl, effecten en schaduw, waar de afbeeldingen vandaan komen, de lichtere kopieën van de afbeeldingen en de pictogrammen. Geldt als de lijst de categorieën als tegels toont. De voorbeeldweergave toont uw niet-opgeslagen wijzigingen."
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES="Subcategorieën"
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES_DESC="Wat elke categorie van de lijst bevat: haar subcategorieën eronder, in een lade, op de achterkant van de tegel of in een ballon. De voorbeeldweergave toont uw niet-opgeslagen wijzigingen."
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS="Categoriebeschrijvingen"
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS_DESC="De in Gridbox geschreven beschrijving van de categorie op haar pagina: waar ze staat, een korte inleiding los van de rest en een lange tekst ingeklapt met een knop „Lees meer”."
COM_BETTERCATEGORIES_PAGE_NAVIGATION="Navigatie"
COM_BETTERCATEGORIES_PAGE_NAVIGATION_DESC="Op een categorie van het laatste niveau links naar de naburige categorieën en terug naar de bovenliggende; in het Gridbox-element Categorieën rijen die hun subcategorieën openen. De voorbeeldweergave toont uw niet-opgeslagen wijzigingen."
COM_BETTERCATEGORIES_PAGE_FILTERS="Filters"
COM_BETTERCATEGORIES_PAGE_FILTERS_DESC="Filters van de productlijst: prijs, productvelden, technische parameters uit de beschrijvingen, kenmerken, aanbieding en voorraad. Waar ze staan, hoe ze eruitzien en wat ze zeggen."
COM_BETTERCATEGORIES_PAGE_CONFIG="Configuratie"
COM_BETTERCATEGORIES_PAGE_CONFIG_DESC="Wat eenmaal wordt ingesteld en vergeten: de winkels en de cache, de gestructureerde gegevens voor zoekmachines en het instellingenbestand."
COM_BETTERCATEGORIES_PLUGIN_OFF="De plugin System - Better Categories for Gridbox is uitgeschakeld, dus de winkelpagina's zijn zoals Gridbox ze toont en de instellingen kunnen niet worden getoond."
COM_BETTERCATEGORIES_SAVED="Instellingen opgeslagen."
COM_BETTERCATEGORIES_SETUP_INTRO="De belangrijkste schakelaars van de winkelpagina's op één plek. Bij elke schakelaar staat of hij voor de meeste sites wordt aanbevolen, en de knop hieronder schakelt alle aanbevolen in (de optionele blijven zoals ze zijn). Alleen de schakelaars die u wijzigt, worden opgeslagen. De details staan daarna op de pagina van elk onderdeel."
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_LABEL="Aantal producten"
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_DESC="Het aantal producten naast elke categorie van de lijst."
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_LABEL="Lege categorieën verbergen"
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_DESC="Een subcategorie zonder producten verschijnt niet in de lijst."
COM_BETTERCATEGORIES_SETUP_QS_TILES_LABEL="Categorieën als tegels met afbeelding"
COM_BETTERCATEGORIES_SETUP_QS_TILES_DESC="Elke categorie van de lijst is een tegel met haar afbeelding in plaats van een tekstlink."
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_LABEL="Lichtere afbeeldingen in de tegels"
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_DESC="De tegels tonen kleine kopieën van de afbeeldingen, eenmalig op de server gemaakt, in plaats van de volledige foto's, zodat de pagina sneller opent."
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_LABEL="Eerste rij tegels eerst"
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_DESC="De afbeeldingen van de eerste rij laden meteen en de andere bij het scrollen, zodat de bovenkant van de pagina eerder verschijnt."
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_LABEL="Subcategorieën in de lijst"
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_DESC="Elke categorie van de lijst toont de namen van haar subcategorieën. Waar (eronder, in een lade, op de achterkant van de tegel) stelt u in op de pagina Subcategorieën."
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_LABEL="Categoriebeschrijvingen"
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_DESC="De in Gridbox geschreven beschrijving van de categorie op haar pagina: waar de categorie-indeling haar heeft of op een plaats naar keuze."
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_LABEL="Lange beschrijvingen inklappen"
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_DESC="Een lange beschrijving wordt ingeklapt tot een paar regels met een knop „Lees meer”. Werkt met de categoriebeschrijvingen ingeschakeld."
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_LABEL="Naburige categorieën"
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_DESC="Een categorie van het laatste niveau toont een balk met de categorieën ernaast en een link terug naar de bovenliggende."
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_LABEL="Rijen van het element Categorieën"
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_DESC="In het Gridbox-element Categorieën opent een klik op de rij van een categorie met subcategorieën die subcategorieën, in plaats van naar haar pagina te gaan."
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_LABEL="Gestructureerde gegevens"
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_DESC="De lijst van categorieën en de kruimelpaden voor zoekmachines (schema.org); de kruimelpaden alleen als de pagina er zelf geen heeft."
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_LABEL="Productfilters"
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_DESC="Filters naast de productlijst: prijs, velden, parameters, kenmerken, aanbieding, voorraad. Welke kiest u op de pagina Filters."
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_LABEL="Gefilterde lijsten buiten zoekmachines"
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_DESC="Een lijst met gekozen filters krijgt noindex, follow, zodat zoekmachines de categoriepagina indexeren en niet elke combinatie van filters."
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_LABEL="Raster of lijst"
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_DESC="Twee knoppen boven de producten tonen ze als raster of als lijst. Werkt met de productfilters ingeschakeld."
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_LABEL="Link „Alles tonen”"
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_DESC="Alle producten van de categorie op één pagina (tot een grens) in plaats van de pagina's van Gridbox. Werkt met de productfilters ingeschakeld."
