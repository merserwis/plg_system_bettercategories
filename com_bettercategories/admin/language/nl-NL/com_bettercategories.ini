COM_BETTERCATEGORIES_CHECK_TEXT="Controleer na het inschakelen of wijzigen van een instelling op uw eigen site of ze goed werkt: als gast (in een privévenster), op een computer en op een telefoon, op verschillende soorten pagina's (de startpagina van de winkel, een categorie met subcategorieën, een categorie van het laatste niveau, een gefilterde lijst). Elke Joomla + Gridbox-winkel is anders gebouwd. Werkt iets niet goed, schakel dat onderdeel dan uit en meld het probleem."
COM_BETTERCATEGORIES_CHECK_SITE="Controleer op uw site of wat u hebt gewijzigd goed werkt, het best als gast in een privévenster: de startpagina van de winkel, een categorie met subcategorieën en een categorie van het laatste niveau."
