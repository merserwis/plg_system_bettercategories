COM_BETTERCATEGORIES_OPEN_GRIDBOX="Open Gridbox"
COM_BETTERCATEGORIES_PAGE_LIST="Category List"
COM_BETTERCATEGORIES_PAGE_LIST_DESC="The list of subcategories Better Categories adds to the store pages: its heading and product counts, where it stands, its columns and spacing, its text and colours, and other settings for other levels of the tree. The preview shows your unsaved changes."
COM_BETTERCATEGORIES_PAGE_TILES="Tiles"
COM_BETTERCATEGORIES_PAGE_TILES_DESC="The categories as image tiles: their style, effects and shadow, where their images come from, the lighter copies of the images and the icons. Used when the list shows the categories as tiles. The preview shows your unsaved changes."
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES="Subcategories"
COM_BETTERCATEGORIES_PAGE_SUBCATEGORIES_DESC="What each category of the list holds: its subcategories below it, in a drawer, on the back of the tile or in a bubble. The preview shows your unsaved changes."
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS="Category Descriptions"
COM_BETTERCATEGORIES_PAGE_DESCRIPTIONS_DESC="The description of the category, written in Gridbox, on its page: where it stands, a short lead apart from the rest, and a long text folded with a “Read more” button."
COM_BETTERCATEGORIES_PAGE_NAVIGATION="Navigation"
COM_BETTERCATEGORIES_PAGE_NAVIGATION_DESC="On a category of the last level, links to the categories next to it and back to the one above; in Gridbox's Categories element, rows that open their subcategories. The preview shows your unsaved changes."
COM_BETTERCATEGORIES_PAGE_FILTERS="Filters"
COM_BETTERCATEGORIES_PAGE_FILTERS_DESC="Filters of the product list: price, product fields, technical parameters read from the descriptions, features, sale and stock. Where they stand, how they look and what they say."
COM_BETTERCATEGORIES_PAGE_CONFIG="Configuration"
COM_BETTERCATEGORIES_PAGE_CONFIG_DESC="What is set once and forgotten: the stores and the cache, the structured data for search engines, and the settings file."
COM_BETTERCATEGORIES_PLUGIN_OFF="The System - Better Categories for Gridbox plugin is disabled, so the store pages are as Gridbox shows them and the settings cannot be shown."
COM_BETTERCATEGORIES_SAVED="Settings saved."
COM_BETTERCATEGORIES_SETUP_INTRO="The main switches of the store pages in one place. Each one shows whether it is recommended for most sites, and the button below turns on all the recommended ones (the optional ones stay as they are). Only the switches you change are saved. The details are on the page of each part afterwards."
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_LABEL="Product counts"
COM_BETTERCATEGORIES_SETUP_SHOW_COUNTER_DESC="The number of products beside each category of the list."
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_LABEL="Hide empty categories"
COM_BETTERCATEGORIES_SETUP_HIDE_EMPTY_DESC="A subcategory without products is left out of the list."
COM_BETTERCATEGORIES_SETUP_QS_TILES_LABEL="Categories as image tiles"
COM_BETTERCATEGORIES_SETUP_QS_TILES_DESC="Each category of the list is a tile with its image instead of a text link."
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_LABEL="Lighter images in the tiles"
COM_BETTERCATEGORIES_SETUP_THUMBNAILS_DESC="The tiles show small copies of the images, made once on the server, instead of the full photos, so the page opens faster."
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_LABEL="First row of tiles first"
COM_BETTERCATEGORIES_SETUP_FIRST_ROW_EAGER_DESC="The images of the first row load at once and the others when scrolled to, so the top of the page shows sooner."
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_LABEL="Subcategories in the list"
COM_BETTERCATEGORIES_SETUP_QS_SUBCATEGORIES_DESC="Each category of the list shows the names of its subcategories. Where (below, in a drawer, on the back of the tile) is set on the Subcategories page."
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_LABEL="Category descriptions"
COM_BETTERCATEGORIES_SETUP_DESC_ENABLED_DESC="The description of the category, written in Gridbox, on its page: where the category layout has it or at a place you choose."
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_LABEL="Fold long descriptions"
COM_BETTERCATEGORIES_SETUP_DESC_FOLD_DESC="A long description is folded to a few lines with a “Read more” button. Works with the category descriptions on."
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_LABEL="Neighbouring categories"
COM_BETTERCATEGORIES_SETUP_LEAF_SIBLINGS_DESC="A category of the last level shows a bar with the categories next to it and a link back to the one above."
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_LABEL="Rows of the Categories element"
COM_BETTERCATEGORIES_SETUP_GB_CATEGORIES_ROWS_DESC="In Gridbox's Categories element, a click on the row of a category with subcategories opens them instead of going to its page."
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_LABEL="Structured data"
COM_BETTERCATEGORIES_SETUP_QS_SCHEMA_DESC="The list of categories and the breadcrumbs for search engines (schema.org); the breadcrumbs only when the page has none of its own."
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_LABEL="Product filters"
COM_BETTERCATEGORIES_SETUP_FILTERS_ENABLED_DESC="Filters beside the product list: price, fields, parameters, features, sale, stock. Which ones is chosen on the Filters page."
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_LABEL="Filtered lists out of search engines"
COM_BETTERCATEGORIES_SETUP_FILTERS_NOINDEX_DESC="A list with filters chosen is marked noindex, follow, so search engines index the category page and not every combination of filters."
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_LABEL="Grid or list"
COM_BETTERCATEGORIES_SETUP_LIST_VIEW_TOGGLE_DESC="Two buttons above the products show them as a grid or as a list. Works with the product filters on."
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_LABEL="“Show all” link"
COM_BETTERCATEGORIES_SETUP_SHOW_ALL_DESC="All the products of the category on one page (up to a limit) instead of the pages of Gridbox. Works with the product filters on."
